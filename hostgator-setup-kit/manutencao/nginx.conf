# A porta e 3000, e nao 80, de proposito: e a MESMA que o `app` escuta.
#
# Com proxy externo (Traefik) isso so casa com o label de porta. Mas com o Caddy
# do proprio kit e o que torna o aviso possivel: o Caddyfile diz
# `reverse_proxy app:3000`, e ele mora DENTRO de um conteiner que nao vamos
# editar no meio de uma atualizacao. O aviso assume o apelido `app` na rede
# interna enquanto o CRM esta parado, e para isso precisa atender onde o Caddy
# procura.
server {
  listen 3000;
  server_name _;
  root /usr/share/nginx/html;

  # 503 e nao 200: quem esta fora do ar por manutencao deve DIZER isso a quem
  # pergunta por maquina. Robo de monitoramento que recebe 200 nao avisa
  # ninguem, e um buscador indexaria "estamos atualizando" como se fosse a
  # pagina inicial do CRM.
  error_page 503 /index.html;
  location = /index.html { internal; }
  location / { return 503; }
}
