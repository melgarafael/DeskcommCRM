# A porta e 3000, e nao 80, de proposito: e a MESMA que o `app` escuta.
#
# Com proxy externo (Traefik) isso so casa com o label de porta. Mas com o Caddy
# do proprio kit — e com o nginx do host mais a ponte `socat`, que e o arranjo da
# instalacao real — e o que torna o aviso possivel: quem roteia procura o app
# pelo NOME, e o aviso atende onde ele ja procura.
server {
  listen 3000;
  server_name _;
  root /usr/share/nginx/html;

  # ⛔ A API NAO RECEBE A PAGINA. Isto foi MEDIDO na instalacao real: o agente da
  # atualizacao reporta o proprio progresso em
  # `POST /api/v1/system/agent`, pelo MESMO endereco publico que o navegador usa.
  # Com o aviso de pe, ele recebia a pagina inteira de volta — 18 KB de HTML no
  # registro de erro dele — e ficava cego justamente durante a janela que ele
  # precisa narrar.
  #
  # Um JSON curto diz a mesma coisa (503, indisponivel) sem entupir registro nem
  # confundir quem espera resposta de maquina. E a ordem importa: `^~` ganha das
  # expressoes regulares e do `location /`, entao a API nunca cai na pagina.
  location ^~ /api/ {
    default_type application/json;
    add_header Retry-After 30 always;
    return 503 '{"error":{"code":"maintenance","message":"atualizacao em andamento"}}';
  }

  # O navegador recebe a pagina — com status 503, e nao 200.
  #
  # Robo de monitoramento que recebe 200 nao avisa ninguem, e um buscador
  # indexaria "estamos atualizando" como se fosse a tela inicial do CRM.
  #
  # ⚠️ O `error_page` mora DENTRO do `location /`, e nao no `server`. No server
  # ele valeria tambem para o 503 da API — e a API voltaria a receber HTML, que e
  # exatamente o defeito que este arquivo acabou de consertar.
  location = /index.html { internal; }
  location / {
    error_page 503 /index.html;
    add_header Retry-After 30 always;
    return 503;
  }
}
