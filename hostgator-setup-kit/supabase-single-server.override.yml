# Acrescentado ao Compose oficial do Supabase self-hosted. A rede compartilhada
# expõe apenas Envoy e Postgres aos containers do CRM. A única porta no host é a
# do gateway, em loopback, que o instalador usa antes de o Caddy existir.
#
# Nomes: o compose oficial fixa `container_name` (supabase-db, supabase-envoy…).
# Com dois Supabase na mesma VPS — este e outro qualquer — o segundo não sobe.
# Aqui eles saem (`!reset`) e cada contêiner leva o nome do projeto, que o kit
# põe no .env (COMPOSE_PROJECT_NAME, ver projeto_do_supabase no _common.sh). A
# lista cobre TODOS os serviços do SUPABASE_REF pinado; um bump que traga
# serviço novo reprova tests/shell/single-server-installer.test.sh.

services:
  studio:
    container_name: !reset null

  api-gw:
    container_name: !reset null
    ports: !override
      - "127.0.0.1:${API_GW_HTTP_PORT:-8000}:8000"
    networks:
      default:
        aliases: [envoy, kong]
      deskcomm_private:
        aliases: [supabase-envoy]
    # #2099 — quando o proxy reverso da VPS é um Traefik PRÓPRIO, as seis
    # superfícies públicas do Supabase precisam de rota NELE. O
    # Caddyfile.single-server tem a regra (@supabase); o
    # docker-compose.traefik.yml foi escrito para Supabase EXTERNO e manda tudo
    # para o app — sem as etiquetas abaixo o Traefik entrega /auth/v1* ao app,
    # que devolve 404, e a validação da fase 2 do install.sh morre em
    # "NEXT_PUBLIC_SUPABASE_ANON_KEY inválido".
    #
    # O arquivo é o MESMO override de todos os modos, então a rota nasce
    # desligada: `traefik.enable` é o que o instalador liga, gravando
    # TRAEFIK_ENABLE=true no .env do Supabase (install-single-server.sh, antes
    # do `dc_supabase up -d --wait`). Quem nunca passou por ali — a instalação
    # em Caddy, a maioria — recebe o default `false` e um Traefik que por acaso
    # exista na VPS não passa a publicar este contêiner.
    labels:
      traefik.enable: "${TRAEFIK_ENABLE:-false}"
      # Rede onde o Traefik acha o IP do Envoy: a ponte privada desta
      # instalação, a mesma declarada em `networks` lá embaixo — o Envoy já
      # está nela, com o apelido supabase-envoy. A rede do PROXY
      # (TRAEFIK_NETWORK) não é declarada aqui de propósito: uma rede externa
      # ausente é recusada ANTES de o compose criar qualquer coisa e derrubaria
      # a instalação em Caddy, que não tem essa rede. Em Traefik `--network
      # host` (Hostinger, o cenário de `unico_traefik()`) o host alcança
      # qualquer bridge, então este IP chega.
      traefik.docker.network: "${SINGLE_SERVER_NETWORK:-deskcomm_single_server}"
      # As seis prefixos do Caddyfile.single-server, uma a uma. O `PathPrefix`
      # aceita um valor por chamada; o `||` é a forma que o Traefik v2 e o v3
      # entendem — e é ele que dá prioridade de casa à regra.
      traefik.http.routers.deskcomm-supabase.rule: "Host(`${TRAEFIK_HOST:-}`) && (PathPrefix(`/auth/v1`) || PathPrefix(`/rest/v1`) || PathPrefix(`/realtime/v1`) || PathPrefix(`/storage/v1`) || PathPrefix(`/functions/v1`) || PathPrefix(`/graphql/v1`))"
      traefik.http.routers.deskcomm-supabase.entrypoints: "${TRAEFIK_ENTRYPOINT:-websecure}"
      traefik.http.routers.deskcomm-supabase.tls.certresolver: "${TRAEFIK_CERTRESOLVER:-letsencrypt}"
      # 500: acima da rota geral do app (`deskcomm`, cuja prioridade padrão é o
      # tamanho da regra) e abaixo do bloqueio 1000 do webhook do WAHA.
      traefik.http.routers.deskcomm-supabase.priority: "500"
      traefik.http.routers.deskcomm-supabase.service: "deskcomm-supabase"
      traefik.http.routers.deskcomm-supabase.middlewares: "deskcomm-supabase-compress"
      traefik.http.services.deskcomm-supabase.loadbalancer.server.port: "8000"
      # `encode gzip` do Caddyfile, que vale para o domínio inteiro.
      traefik.http.middlewares.deskcomm-supabase-compress.compress: "true"

  auth:
    container_name: !reset null
    environment:
      # #1653 — o `disable_signup` que fecha `POST /auth/v1/signup` (caminho
      # direto, com a anon key) mora na chave OFICIAL `DISABLE_SIGNUP` do .env
      # do Supabase, escrita pela função `sincronizar_signup_mode_do_gotrue` do
      # kit a partir do modo de cadastro da instalação. O compose do Supabase já
      # faz este mesmo mapeamento; repeti-lo aqui prende o nome contra mudança
      # no upstream sem criar uma segunda variável. Default `false` = o
      # comportamento de sempre para .env que não tem a chave.
      GOTRUE_DISABLE_SIGNUP: "${DISABLE_SIGNUP:-false}"

      # #2109 — os dois modelos de e-mail de acesso. O molde padrão do GoTrue
      # devolve a sessão no FRAGMENTO da URL (`/auth/v1/verify`), e fragmento
      # não chega ao servidor: `app/auth/confirm` cai em
      # `/login?error=link_invalido` e a recuperação de senha não fecha. As
      # chaves vêm do `.env` do Supabase, escritas pelo
      # `install-single-server.sh`; sem este mapeamento elas não chegariam ao
      # contêiner, porque o compose oficial só mapeia `GOTRUE_SMTP_*` e
      # `GOTRUE_MAILER_URLPATHS_*`. Default vazio = o molde padrão do GoTrue,
      # o comportamento de sempre para um `.env` que nunca passou por aqui.
      GOTRUE_MAILER_TEMPLATES_CONFIRMATION: "${GOTRUE_MAILER_TEMPLATES_CONFIRMATION:-}"
      GOTRUE_MAILER_TEMPLATES_RECOVERY: "${GOTRUE_MAILER_TEMPLATES_RECOVERY:-}"

  rest:
    container_name: !reset null

  realtime:
    container_name: !reset null
    networks:
      default:
        # O Envoy chama este HOST (e o realtime tira o tenant do subdomínio);
        # o que o nome do contêiner fazia, o apelido na rede do projeto faz.
        aliases: [realtime-dev.supabase-realtime]

  storage:
    container_name: !reset null

  imgproxy:
    container_name: !reset null

  meta:
    container_name: !reset null

  functions:
    container_name: !reset null

  db:
    container_name: !reset null
    networks:
      default: {}
      deskcomm_private:
        aliases: [supabase-db]

  supavisor:
    container_name: !reset null
    # O kit fala com o Postgres pela rede privada; porta no host só colidiria
    # com outro Postgres/Supabase da VPS.
    ports: !reset []

networks:
  deskcomm_private:
    external: true
    name: ${SINGLE_SERVER_NETWORK:-deskcomm_single_server}
