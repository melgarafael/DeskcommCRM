      # ─── PARTE 4 — a spec de VPS fresca, e quem pode entrar ao lado dela ───
      #
      # A `vps-fresh-onboarding` era a última spec fora do CI. A infraestrutura
      # que faltava chegou em dois lugares:
      #
      #  * o passo "Subir WAHA e o par Redis da VPS fresca" (`docker run`, só
      #    nesta parte): WAHA (devlikeapro/waha) e o par Redis do
      #    `docker-compose.prod.yml` — `redis:7-alpine` + o
      #    `hiett/serverless-redis-http` que fala o REST do Upstash;
      #  * `scripts/duble-saas-e2e.mjs`: dublê HTTP REAL (recebe requisição de
      #    verdade, na porta, com processo separado) do Resend e do handshake
      #    OAuth da Nuvemshop. Não é mock em processo — a doutrina de QA visual
      #    pede receiver real para efeito colateral externo.
      #
      # Ela veio para cá por um motivo que não é relógio: as partes 1 a 3
      # explicitamente NÃO resetam o banco entre specs (é a vizinhança que elas
      # escolheram), e a fresca precisa do oposto — a instalação sem dono, sem
      # tenant, sem fixtures. Por isso os dois passos de semeadura
      # (`Semear credenciais de teste` e `Semear as fixtures`) recebem
      # `if: matrix.parte != 4`, e o único dado que existe antes dela é o dono
      # do bootstrap — criado pelo passo `Criar o dono da instalação`, com o
      # mesmo `scripts/bootstrap-owner.ts` que o `install.sh` roda na VPS. A
      # spec EXIGE esse dono como precondição (está no cabeçalho dela, junto de
      # WAHA e Redis); o que ela afirma é a jornada a partir dali, não a
      # existência do usuário.
      #
      # `funil-arquivado-volta-pela-tela` entrou aqui, e ela NÃO precisa de WAHA,
      # Redis, Resend nem Nuvemshop — o critério desta parte deixou de ser só
      # "depende de serviço externo" e passou a incluir "onde cabe no relógio".
      # Medido no run 35448173547: as fatias deram 25, 24, (cortada pelo teto) e
      # 6 minutos, contra `timeout-minutes` de 30 e orçamento de 24. A parte 4 é
      # a única com folga; pôr esta spec em qualquer uma das outras três mataria
      # o job por relógio, que é reprovação sem relação com o que se mede.
      #
      # ⚠️ ELA SEMEIA O PRÓPRIO DADO, e isso é precondição, não conveniência: os
      # passos `Semear credenciais de teste` e `Semear as fixtures` são
      # `if: matrix.parte != 4`, então aqui não existe `.e2e-creds.json`. O
      # `beforeAll` dela roda `scripts/seed-e2e-credentials.ts` (lê o ambiente,
      # que já tem o `.env.e2e` publicado no job) e apaga os próprios funis no
      # `afterAll`.
      #
