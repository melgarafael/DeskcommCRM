name: e2e

# Issue #63: as specs de tests/e2e/ não rodavam em lugar nenhum. Este job fecha o
# buraco com o subconjunto que não depende de serviço externo.
#
# NÃO conte aqui quantas são: o summary do job CONTA em vez de afirmar, e
# `tests/unit/e2e-cobertura-completa.test.ts` reprova o build quando uma spec do
# disco não está em nenhuma das quatro listas abaixo. Um número escrito nesta linha
# é a quarta fonte da mesma verdade, e as três anteriores já divergiram — este
# cabeçalho dizia "29 de 33" quando o disco tinha 45 e o job rodava 44.
#
# A execução é dividida em DUAS invocações do playwright de propósito: o
# limitador de login do produto é por IP (60/300s) e no CI todos os specs vêm do
# mesmo 127.0.0.1. Ver o comentário do passo "E2E — parte 1 de 4".
#
# É CHECK OBRIGATÓRIO. A régua, para reconferir em vez de acreditar nesta linha:
#   $ gh api repos/melgarafael/DeskcommCRM/branches/main/protection \
#       --jq '.required_status_checks.contexts|join(", ")'
#   verify, build-and-size, invariants, e2e, imagens-ok   # medido em 2026-08-14
#
# São CINCO. A versão anterior deste bloco colava a saída de 2026-08-12, com
# quatro — `imagens-ok` virou obrigatório em 2026-08-13, um dia depois. Trocar
# uma afirmação vencida por outra vencida é o mesmo defeito, e o commit
# bcd88c30 desta branch existe justamente por causa dele: quem lê aqui para
# saber contra o que medir concluiria que imagem quebrada não segura merge.
# Este cabeçalho afirmou o contrário ("NÃO-BLOQUEANTE por ausência… quando N
# execuções seguidas passarem limpas, adicionar aos obrigatórios") por tempo
# demais depois de a promoção ter acontecido — e quem lesse isso mediria o custo
# de uma mudança contra a régua errada.
#
# O job falha honestamente: a primeira versão usava `continue-on-error: true` no
# job inteiro e reportou VERDE com o `supabase start` quebrado e zero teste
# executado. Verde que não distingue "passou" de "nem rodou" é pior que vermelho.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# O GITHUB_TOKEN deste job serve a `actions/checkout` (clone) e a
# `actions/setup-node` (manifest de `actions/node-versions`, repo público).
#
# `supabase/setup-cli@v3` merece a frase inteira, porque a resposta curta está
# errada: ele é `using: composite` e aninha `oven-sh/setup-bun`, cujo input
# `token` tem default `${{ github.token }}` — o token É repassado. Com o
# `.bun-version` do setup-cli fixo em semver exato, o caminho que gasta o token
# (api.github.com/repos/oven-sh/bun/git/refs/tags) não é tomado; se um dia for, é
# leitura de repo público e `contents: read` basta. Grep no `action.yml` de topo
# não enumera consumidor de token quando a action é composite: o consumidor mora
# um nível abaixo.
#
# `actions/upload-artifact@v7` não tem input de token: publica pela Actions
# Results API, com ACTIONS_RUNTIME_TOKEN + ACTIONS_RESULTS_URL. Nenhum passo
# `run:` enxerga o GITHUB_TOKEN — ele só entra no ambiente via
# `secrets.GITHUB_TOKEN`, ausente aqui.
permissions:
  contents: read

# Cancelamento da rodada superada: por JOB (os pesados), nunca no workflow nem
# no agregador — razão medida e a tabela por evento no cabeçalho do ci.yml.

jobs:
  # O PR ALCANÇA ALGO QUE O E2E MEDE? Responde em segundos, antes das partes.
  #
  # O e2e é o maior consumidor da fila: 56% dos minutos de runner medidos de 15 a
  # 18/09/2026. Um PR só de documentação, teste de outra suíte ou workflow alheio
  # pagava três partes de ~23 min para medir o mesmo produto — 25 dos 200 PRs
  # mais recentes eram assim. A regra, e o porquê de cada caminho, estão no
  # cabeçalho de scripts/pr-alcanca-o-e2e.sh.
  #
  # Fora de pull_request é SEMPRE `sim`: a `main` mede tudo. Falha ao listar,
  # lista cortada (≥3000) ou resposta estranha também viram `sim`. E o agregador
  # `e2e` só aceita parte pulada quando ESTE job terminou `success` com `nao`:
  # job que falhou aqui reprova, em vez de passar por falta de medida.
  #
  # Roda nas máquinas do GitHub sempre: é de segundos, e não pode depender do
  # executor próprio estar de pé para decidir nada.
  e2e-alcance:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      e2e: ${{ steps.alcance.outputs.e2e }}
    steps:
      - uses: actions/checkout@v7
        if: github.event_name == 'pull_request'
        with:
          sparse-checkout: scripts/pr-alcanca-o-e2e.sh
          sparse-checkout-cone-mode: false

      - name: O PR alcança o que o e2e mede?
        id: alcance
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          set -uo pipefail
          if [ "${GITHUB_EVENT_NAME}" != "pull_request" ]; then
            echo "e2e=sim" >> "$GITHUB_OUTPUT"; echo "evento ${GITHUB_EVENT_NAME}: roda"; exit 0
          fi
          if ! arquivos=$(gh api --paginate "repos/${GITHUB_REPOSITORY}/pulls/${PR}/files" --jq '.[].filename'); then
            echo "e2e=sim" >> "$GITHUB_OUTPUT"; echo "::warning::não consegui listar os arquivos do PR — roda"; exit 0
          fi
          n=$(printf '%s\n' "$arquivos" | grep -c . || true)
          if [ "$n" -ge 3000 ]; then
            resposta=sim
          else
            resposta=$(printf '%s\n' "$arquivos" | bash scripts/pr-alcanca-o-e2e.sh) || resposta=sim
          fi
          [ "$resposta" = "nao" ] || resposta=sim
          echo "e2e=${resposta}" >> "$GITHUB_OUTPUT"
          echo "${n} arquivo(s) no PR → e2e=${resposta}"

  # AS DUAS PARTES RODAM EM PARALELO, e o motivo é medido, não estético.
  #
  # Elas rodavam como dois passos do MESMO job, então somavam contra um único
  # teto de 30 min. Medido no run 33125422531, o último verde antes deste
  # conserto: parte 2 = 16,3 min, parte 1 = 8,2 min, setup (build + Supabase +
  # browser) ≈ 4,5 min — total ≈ 29 min, com 1 min de folga. A folga acabou:
  # dois runs da própria `main` foram CANCELADOS em 30 min exatos (23:30→00:00
  # e 23:26→23:56 de 2026-08-27), e um PR de UM arquivo foi cancelado junto.
  #
  # Em paralelo, cada parte paga o setup uma vez e tem o teto inteiro para si:
  # o job mais longo passou a ser ≈ 21 min em vez de ≈ 29.
  #
  # ⚠️ ESSA ÚLTIMA FRASE VENCEU. Ela estava certa quando escrita e descreve o
  # efeito do paralelismo, não o estado: dez dias depois o job mais longo era 26
  # min e chegou a ser cancelado aos 30. Quem lê "≈ 21 min" para saber se cabe
  # mais spec mede contra a régua errada. O estado de hoje está no bloco
  # "REBALANCEAMENTO DE 2026-09-04" mais abaixo — que também traz o comando que
  # produz o número, porque número escrito envelhece e comando não.
  #
  # E há um ganho que não era o objetivo: a razão de existirem partes separadas é
  # "processo novo, contador de login zerado" — o teto por IP. Runners de
  # matrix são máquinas diferentes, com IPs diferentes, então a separação
  # deixa de depender de reiniciar o processo.
  #
  # O teto de 30 min FICA. Ele é o que denuncia a suíte crescendo de novo;
  # subi-lo seria trocar um vermelho honesto por um CI que demora mais a cada
  # mês sem ninguém perceber.
  #
  # A parte 4 já custou às outras três: os contêineres dela (WAHA, redis,
  # serverless-redis-http) eram `services:`, que é chave do JOB e sobe em
  # TODAS as pernas — o Actions não aceita condição por braço da matriz. Na
  # parte 1 do run 35124188017, que não usa nenhum deles, "Initialize
  # containers" foi de 16:53:22.468 a 16:54:13.725 — 51s, quase todos no pull
  # do WAHA —, com a parte 3 do mesmo run em 26m04s. Agora eles sobem por
  # `docker run` no passo "Subir WAHA e o par Redis da VPS fresca", com
  # `if: matrix.parte == 4`. Não os devolva para `services:`: a guarda
  # `tests/unit/e2e-parte-4-fala-com-os-servicos-do-runner.test.ts` reprova.
  e2e-parte:
    needs: [e2e-alcance]
    if: needs.e2e-alcance.outputs.e2e == 'sim'
    # Executor próprio para trabalho NOSSO (push na main, PR de branch deste
    # repo) quando a variável de repositório EXECUTOR_PROPRIO vale `ligado`;
    # máquinas do GitHub para todo o resto, fork inclusive. A expressão decide
    # só para quem não a edita — a guarda que vale contra fork mora na máquina
    # (infra/executor-proprio/so-o-que-e-nosso.sh). Vigiado por
    # tests/unit/executor-proprio-so-roda-o-que-e-nosso.test.ts.
    runs-on: ${{ vars.EXECUTOR_PROPRIO == 'ligado' && (github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository) && 'deskcomm-proprio' || 'ubuntu-latest' }}
    # O teto FICA EM 30, e essa foi uma correção de rumo desta branch.
    #
    # Eu tinha subido para 45, com o argumento de que o teto acumula dois papéis
    # que brigam (guarda de travamento × detector de crescimento) e de que só o
    # primeiro depende do valor. O argumento continua certo para o `verify`.
    #
    # Aqui ele é FALSO, e quem mostrou foi o @webtecnica no #1056: com o corte
    # legível dele em TETO − MARGEM, o `timeout-minutes` vira inalcançável, e o
    # portão real passa a ser TETO_SEGUNDOS. Subir os dois juntos não separa
    # papel nenhum — move o portão de 28 para 43 min. É exatamente o
    # afrouxamento contra o qual ele escreveu uma catraca, e ela me reprovou.
    #
    # O conserto certo não é afrouxar: é repartir. Por isso esta branch traz o
    # rebalanceamento junto (o #1174), e com as partes em ~18 min o portão de 28
    # deixa de ser apertado sem que ninguém precise ceder.
    timeout-minutes: 30
    concurrency:
      group: ${{ github.workflow }}-e2e-parte${{ matrix.parte }}-${{ github.event.pull_request.number || github.ref }}${{ github.event_name == 'pull_request' && github.run_attempt != '1' && format('-reentrada-{0}', github.event.pull_request.head.sha) || '' }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    strategy:
      # Sem fail-fast: se a parte 1 quebrar, ainda quero saber se a 2 também.
      # Com ele ligado, o primeiro vermelho esconde o outro e o conserto vira
      # uma rodada por parte.
      fail-fast: false
      matrix:
        parte: [1, 2, 3, 4, 5]
    # ─────────────────────────────────────────────────────────────────────────
    # A COBERTURA DEIXA DE SER PROSA DIGITADA À MÃO.
    #
    # Antes, as listas viviam nos dois `run:` e a declaração do que NÃO é coberto
    # era um `echo` escrito à mão. As duas fontes divergiram em silêncio: o texto
    # dizia "32 de 33 specs" quando o disco tinha 39 e o job rodava 36 — e as
    # ausentes eram justamente as novas, incluindo `agente-papeis-operador`, a
    # prova de tela do épico dos três papéis, que nunca rodou em job nenhum.
    #
    # Cobertura parcial silenciosa se lê como cobertura total. Agora há UMA fonte
    # por lista, o summary CONTA em vez de afirmar, e
    # `tests/unit/e2e-cobertura-completa.test.ts` reprova o build quando um arquivo
    # de spec não está em nenhuma das quatro listas.
    #
    # FORA_DO_CI exige motivo escrito no próprio nome do bloco abaixo — spec fora
    # do gate sem razão declarada é a dívida voltando pela porta de serviço.
    # ─────────────────────────────────────────────────────────────────────────
    #
    # ═══ `cadastro-sem-confirmacao-de-email`: A PRECONDIÇÃO É DO PROVEDOR ═══
    #
    # Ela mede o cadastro com "Confirm email" DESLIGADO no provedor de auth — o
    # estado em que `signUp()` já devolve sessão e não existe link nenhum para
    # clicar. Isso não é dado que a spec possa semear: é `GOTRUE_MAILER_AUTOCONFIRM`,
    # fixado quando o Supabase local sobe, e o `supabase/config.toml` do repo
    # declara `enable_confirmations = true` — que é o que `signup-journey` e
    # `invite-lifecycle` exercitam. Ligar o autoconfirm por causa desta spec
    # trocaria o provedor da SUÍTE INTEIRA, e as duas de cima passariam a medir
    # outro fluxo sem que ninguém percebesse.
    #
    # O gate de todo dia é o par de testes de unidade, que roda no `verify`:
    # `app/actions/auth/signUp.test.ts` (a action DIZ que a sessão veio aberta) e
    # `tests/unit/cadastro-sem-confirmacao-nao-manda-esperar-email.test.tsx` (a
    # tela AGE sobre isso). A spec é a prova pela tela de que os dois, juntos,
    # resolvem a jornada — e ela CONFERE a própria precondição em `beforeAll`,
    # falhando alto em vez de se auto-pular.
    #
    # ═══ `aviso-de-caso-chega-no-whatsapp`: O CI NÃO TEM ENDEREÇO PÚBLICO ═══
    #
    # Ela prova o envio de verdade do aviso de caso, com um receptor HTTP no
    # lugar do WhatsApp — e para isso precisa de um `NEXT_PUBLIC_APP_URL`
    # público, porque o produto RECUSA mandar um aviso cujo link não abriria no
    # celular de outra pessoa (`lib/escalacao/aviso-ao-suporte.ts`, guarda 9;
    # `lib/escalacao/aviso-de-teste.ts`, guarda 9).
    #
    # O `.env.e2e` grava `NEXT_PUBLIC_APP_URL=http://localhost:$E2E_PORT`, e não
    # por esquecimento: é o endereço em que o servidor sob teste responde de
    # verdade, e as três specs de fluxo por e-mail (`password-recovery`,
    # `reset-password-mfa`, `signup-journey`) quebram se ele apontar para outro
    # lugar — o browser segue o 3xx e cai onde não há ninguém escutando. O valor
    # é lido uma vez, no boot (`lib/env.ts`, `safeParse(process.env)`), então não
    # há como valer só para uma spec: trocá-lo troca para a suíte inteira.
    #
    # O que roda no CI é `aviso-de-caso-no-whatsapp.spec.ts`, e ela não pula o
    # assunto: prova a tela E a RECUSA honesta ponta a ponta (a entrega nasce
    # `falhou/sem_endereco_publico` e a tela diz isso em português), que é
    # exatamente o comportamento de uma instalação recém-feita.
    #
    # A spec de fora CONFERE a própria precondição e falha alto com a receita de
    # como rodá-la — `test.skip()` seria um verde que não distingue "passou" de
    # "nem tentou". A prova local está em `evidence/casos-vivos/aviso/`.
    #
    # ═══ O 429 DE `olhar-telas-do-epico`: RESOLVIDO DUAS VEZES, EM CAMADAS DIFERENTES ═══
    #
    # A spec reprovava com **429** em TODAS as 7 telas, falha PRÉ-EXISTENTE NA MAIN (run
    # 31343408488, main, 2026-08-10T00:03, lista byte-idêntica).
    #
    # Duas sessões chegaram à MESMA causa raiz em paralelo, sem se ver, e os dois
    # consertos são complementares — nenhum torna o outro dispensável:
    #
    #  - `a60cae2d` (main, PR #220) desligou a telemetria NO AMBIENTE DO CI:
    #    `SENTRY_DSN: "off"` no build e em todas as partes (e no `perf.yml`). Ver o
    #    comentário do passo "Build de produção" abaixo — a armadilha é que vazio NÃO
    #    desliga, seleciona o Sentry da comunidade.
    #  - `77b4a486` (este PR) consertou O PRODUTO: o SDK do browser mandava duas SESSÕES
    #    de release health por NAVEGAÇÃO para o DSN da comunidade — de toda instalação
    #    self-host, não só do CI. `browserSessionIntegration` é default do SDK e
    #    `integrations: [x]` SOMA aos defaults, então a política "no Sentry da comunidade,
    #    só erro" estava declarada e não estava em vigor. Detalhe em `lib/sentry/dsn.ts`;
    #    o gate é `tests/unit/sentry-comunidade-so-erro.test.ts`.
    #
    # O ingest respondia `429` com `x-sentry-rate-limits: 60::organization:suspended` —
    # lista de categorias vazia, isto é, TODAS: a organização estava suspensa por cota, e
    # cada tentativa barrada virava erro de console, que é o que esta spec cobra.
    #
    # FONTE DA VERDADE do ambiente da suíte é `scripts/gerar-env-e2e.sh` (o `.env.e2e`
    # que o passo "Publicar" joga no `$GITHUB_ENV`, e que vale também para quem roda
    # local). As três linhas `SENTRY_DSN: "off"` de nível de passo FICAM como segunda
    # camada — `env:` de passo vence o `$GITHUB_ENV`, então elas protegem o CI se o
    # gerador mudar. Duas fontes que CONCORDAM e uma delas declarada como principal;
    # apagar as do colega para "limpar duplicação" seria trocar defesa por estética.
    #
    # Três hipóteses minhas caíram por medição, e o custo delas foi maior que o do
    # conserto. As duas primeiras foram descartadas na época:
    #
    #  1. "a parte 2 está sobrecarregada" — caiu de 69 para 53 testes, falha byte-idêntica.
    #  2. "as specs anteriores exaurem o contador" — posta em PRIMEIRO lugar, contador
    #     limpo, as mesmas 7 telas deram 429, inclusive a primeira.
    #  3. "é o fallback em memória do limitador" — foi o que este comentário afirmou como
    #     "a pista que sobra". MEDIDO no job real: 120 quedas para memória, 103 delas no
    #     bucket `auth:login:ip` contra teto de 1000. O limitador não barrou nada.
    #
    # A lição operacional é sobre INSTRUMENTO, não sobre limitador: a mensagem do browser
    # para requisição barrada é "Failed to load resource: ... 429" e não diz QUEM
    # respondeu; a spec descartava `m.location()` e o relatório não guarda trace, então a
    # única cópia do endereço morria ali. Três runs foram gastos adivinhando o dono de um
    # 429 cuja URL o próprio teste tinha em mãos. A spec agora registra a URL.
    #
    # `AUTH_RATE_LIMIT_LOGIN_IP` segue existindo pelo motivo dele (o teto por IP no CI é
    # um runner só) e não teve nada a ver com isto. Afrouxar o limitador do produto para
    # acomodar teste segue sendo a troca errada — e aqui não foi preciso.
    #
    # A ordem das listas voltou ao que era: mudá-la foi tentativa que não se sustentou,
    # e deixar a mudança de pé com um comentário dizendo "hipótese" seria pior — o
    # próximo leitor herdaria uma decisão tomada por um motivo medido FALSO.
    #
    # O rebalanceamento das duas partes FICA, por outro motivo e sem alegar mais do que
    # faz: 6,5 + 8,1 min em vez de 2,7 + 12,2.
    #
    # ═══ REBALANCEAMENTO DE 2026-09-04 — O PRIMEIRO MEDIDO POR ARQUIVO ═══
    #
    # A folga acabou de novo. Run 33820766602 (verde), confirmado em seis rodadas:
    #
    #   parte 1: 103 testes · 9,1 min de Playwright · job 18 min
    #   parte 2: 127 testes · 18,0 min de Playwright · job 26 min
    #   setup (build + Supabase + browser) ≈ 8-9 min, igual nos dois
    #   as seis: parte 1 = 18 17 15 15 18 14 min · parte 2 = 26 28 26 26 25 25 min
    #
    # E não é mais risco: a parte 2 já ESTOUROU o teto — 30 min 17 s num PR, e de
    # novo no run 33823969191 (deste PR), CANCELADA aos 30 min com 117 dos 133
    # casos terminados.
    #
    # ── Por que contagem de TESTES não serve como régua ─────────────────────
    #
    # Este arquivo já registra dois proxies que inverteram o sinal da medição
    # (ver o bloco de `SPECS_PARTE_1` abaixo). O terceiro proxy tentador é o
    # número de testes por parte, e ele cai na PRÓPRIA tabela acima:
    #
    #   103 testes / 9,1 min  = 5,3 s por teste na parte 1
    #   127 testes / 18,0 min = 8,5 s por teste na parte 2
    #
    # O mesmo "teste" custa 60% mais de um lado. E dentro de uma parte a
    # dispersão é MAIOR: medido por arquivo no run 33823969191,
    # `agenda-kit-visual` tem 20 casos e custa 21,6 s; `navegacao` tem 9 casos e
    # custa 239,2 s. Mover o arquivo com MAIS casos desloca **11× menos tempo**
    # que mover o de menos.
    #
    # ── O instrumento, para não haver quarto proxy ──────────────────────────
    #
    # O passo de execução roda com `--reporter=list` (o `dot`, default em CI,
    # despeja os pontos em rajada — 37 numa linha só, cobrindo 4,9 min). Cada
    # caso vira uma linha carimbada pelo Actions, e o custo de RELÓGIO de um
    # arquivo é o intervalo entre o último caso dele e o último caso do arquivo
    # anterior — o que inclui o `beforeAll`, que é onde as specs pagam o
    # `execFileSync` dos seeds.
    #
    # Somar a duração que o reporter imprime NÃO serve: `result.duration` é só o
    # caso. Medido na parte 1 do 33823969191 — soma das durações 7,14 min contra
    # 7,95 min de relógio contra 8,1 min do rodapé do Playwright. O relógio
    # fecha em 98% do rodapé; a soma das durações joga fora 12%, concentrado
    # justamente nas specs que semeiam.
    #
    # Para refazer a medição em qualquer run, em vez de acreditar nos números
    # desta seção:
    #
    #   gh run view --job <id-do-job> --log > /tmp/e2e.log
    #   grep -E '\[chromium\] › tests/e2e/' /tmp/e2e.log
    #
    # ── O que mudou, e por que UM arquivo só ────────────────────────────────
    #
    # `navegacao.spec.ts` vai da PARTE_2 para a PARTE_1. Medido: 239,2 s
    # (3,99 min), 23,3% de todo o relógio que a parte 2 chegou a gastar antes do
    # corte. É o maior item das duas partes depois de `prova-painel-provedores`,
    # e move sozinho quase exatamente o que falta.
    #
    # Um arquivo só, e não três de peso médio, porque as duas partes rodavam
    # contra o MESMO banco sem reset: cada spec movida era uma vizinhança nova.
    # ⚠️ ESTA FRASE VENCEU e fica como registro do que valia: hoje `supabase
    # start` é passo do PRÓPRIO `e2e-parte`, e a matriz dá um runner (e um banco)
    # por parte. Mover spec entre partes deixou de criar vizinhança de DADO; o
    # que sobra é vizinhança de ORDEM dentro da parte, que o Playwright resolve
    # em ordem alfabética de arquivo. Conferir na fonte, não nesta linha:
    # `grep -n "supabase start" .github/workflows/e2e.yml` e o job em que ele cai.
    # `navegacao` é a que tem menos aresta — só afirma cromo de navegação
    # (sidebar, abas, ⌘K, medidas de layout), não lê dado semeado por vizinha
