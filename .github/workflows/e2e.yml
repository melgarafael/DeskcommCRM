      # A `vps-fresh-onboarding` saiu desta lista no PR da issue #179 (a infra
      # dela está no `SPECS_PARTE_4` logo acima). As de baixo continuam fora, e
      # o motivo de cada uma está escrito neste arquivo — no topo do workflow ou
      # logo abaixo. (Este parágrafo dizia "as duas" com três na lista: número
      # em prosa envelhece, e por isso ele saiu.)
      #
      # `jev-chave-real` entrou aqui em 2026-09-23: EXIGE UMA CHAVE PAGA da
      # TypeSafe AI (`JEV_API_KEY`), e segredo de repositório público não é
      # lugar para ela. Não é o caso de ficar no CI e pular os casos pagos, como
      # a `acervo-de-conhecimento` faz: aqui a chave é a spec inteira, e mesmo
      # com ela este job a reprovaria — o `pnpm e2e:env` aponta o Jev do
      # servidor para o dublê, e ela recusa medir o dublê. O que o CI prova é a
      # `jev-decisoes-rapidas` (PARTE_5), contra um dublê que responde o contrato
      # MEDIDO na API real. O que só esta prova é que o contrato ainda é esse — a
      # versão fixada responde e a chave passa no teste. Sem a chave, ela pula; o
      # cabeçalho dela tem a receita para rodar contra a API de verdade.
      FORA_DO_CI: >-
        inbox-tempo-real.spec.ts
        cadastro-sem-confirmacao-de-email.spec.ts
        aviso-de-caso-chega-no-whatsapp.spec.ts
        jev-chave-real.spec.ts
    steps:
      # ── O RELÓGIO DESTA PARTE: ONDE O TETO DE 30 MIN COMEÇA A CONTAR ──────
      #
      # O `timeout-minutes` do job conta do INÍCIO DO JOB, então é do
      # início do job que o aviso tem de medir. Medir só o relógio do
      # Playwright deixaria de fora o que o preparo já gastou — e o preparo é
      # pago por parte (checkout, `preparar-node`, stack do Supabase, baseline,
      # build, env): no run 35160549180 a parte 1 gastou 978 s de Playwright,
      # mas o relógio do JOB cravou os 30 min e o caso **141 de 156 estava
      # VERDE** quando o cancelamento chegou. Sem este T0, a parte que cresce
      # chega a quem olha o run como "a rodada caiu" — ou seja, como problema
      # de infraestrutura — e o log precisa ser contado caso a caso para
      # descobrir que o problema era o TAMANHO da parte.
      #
      # Este passo é o PRIMEIRO do job, de propósito: tudo depois dele entra no
      # DECORRIDO. Se ele descer na ordem, a medição volta a mentir por baixo.
      - name: Marcar o relógio da parte (orçamento × teto)
        run: |
          set -euo pipefail
          {
            echo "T0_JOB=$(date -u +%s)"
            # Orçamento declarado: é aqui que a parte deveria caber, com o
            # relógio do job inteiro. 24 min < teto de propósito — o aviso vem
            # ANTES do corte, não no lugar dele.
            echo "ORCAMENTO_SEGUNDOS=1440"
            # O MESMO teto do `timeout-minutes` do job (30 min). Dois números
            # medindo o mesmo relógio divergem: a catraca é
            # tests/unit/e2e-avisa-antes-do-teto.test.ts, que reprova se este
            # valor e o `timeout-minutes` deixarem de concordar.
            echo "TETO_SEGUNDOS=1800"
            # Corte antecipado, 2 min antes do teto. A margem paga o que o
            # relógio de passo NÃO vê: o que o runner faz antes do primeiro passo
            # (até o #983 incluía ~51 s de `Initialize containers` em toda
            # perna; os contêineres agora sobem só na parte 4, dentro de um
            # passo) e o envio de artefato/resumo depois da suíte.
            # ── A CARÊNCIA DO KILL É UM CUSTO, E ELE FOI MEDIDO ─────────
            #
            # O corte abaixo usa `timeout -k 30 --signal=TERM`. O `-k 30` NÃO é
            # grátis, e o custo tem uma condição. Medido pelo @webtecnica
            # (GNU coreutils 9.4, orçamento reduzido a 2s e filho dormindo 90s
            # para não terminar sozinho e mascarar a carência):
            #
            #   timeout -k 3  2 …'trap "" TERM; sleep 90'          rc=137   5,00s
            #   timeout -k 30 2 …'trap "" TERM; sleep 90'          rc=137  32,00s
            #   timeout -k 30 2 …'trap "exit 143" TERM; sleep 90'  rc=124   2,01s
            #
            # A conta fecha exata: **a carência custa o valor do `-k`, e SÓ
            # quando o filho ignora o TERM.** Quem sai no TERM não paga nada.
            # Traduzido para cá:
            #
            #   spec que respeita o TERM → morre em FOLGA,      rc=124
            #   spec que IGNORA  o TERM → morre em FOLGA + 30s, rc=137
            #
            # ⚠️ RESTRIÇÃO DE DESENHO, e é ela que este comentário existe para
            # não deixar implícita: o job precisa de **ao menos 30s de folga
            # dentro do `timeout-minutes` depois do ponto de corte**. Senão o
            # corte do próprio GitHub chega ANTES do KILL, e o aviso existe mas
            # ninguém chega a ler — gate que fala depois de o job morrer é gate
            # decorativo.
            #
            # A conta em vigor, conferida antes de o #1184 ser mesclado:
            #
            #   corte ............. (1800 − 120) / 60 = 28,0 min
            #   KILL .............. 28,0 + 30s        = 28,5 min
            #   teto do job ....... 30,0 min
            #   folga após o KILL .................... 90 s   ← 3× o mínimo
            #
            # Quem mexer em MARGEM_SEGUNDOS refaz essa conta: `MARGEM` menor que
            # ~35s põe o KILL depois do teto e cala o aviso.
            #
            # NÃO MEDIDO: o caso completo no e2e, com um spec que ignore o TERM
            # de propósito. O `-k 30` está aqui por comportamento observado no
            # `timeout` (os três `rc` acima), não por sabotagem de spec real.
            echo "MARGEM_SEGUNDOS=120"
            # Piso para a suíte sequer começar: com menos que isto, rodar a
            # suíte é gastar o que resta para ver um cancelamento no meio.
            echo "PISO_SEGUNDOS=120"
          } >> "$GITHUB_ENV"
          echo "parte ${{ matrix.parte }}: relógio do job iniciado em $(date -u +%H:%M:%S) UTC"

      - uses: actions/checkout@v7

      # ─── As portas do Supabase saem da faixa efêmera do kernel ─────────────
      #
      # O `supabase start` publica portas FIXAS no host — as de
      # `supabase/config.toml`, 54320 a 54329 — e todas caem dentro da faixa
      # efêmera do Linux (`net.ipv4.ip_local_port_range`, 32768–60999 no
      # runner). Qualquer conexão de SAÍDA deste job (o pull das imagens do
      # próprio Supabase, o `pnpm install`) pode receber uma delas como porta de
      # origem, e o bind do contêiner morre com
      #
      #   failed to bind host port for 0.0.0.0:54322:172.18.0.2:5432/tcp:
      #   address already in use
      #
      # Medido de 15 a 22/09/2026: 6 partes vermelhas assim (54322 cinco vezes,
      # 54324 uma), em 5 PRs e 1 push da `main` — runs 34997333501, 35013924504,
      # 35331913043, 35343096791, 35423329919 e 35497099264 —, todas em
      # `ubuntu-latest`, com a parte morta em ~2 min sem rodar teste. A triagem
      # mandava rerodar (§3-quater do TRIAGEM.md). Reservar as portas tira-as do
      # sorteio do kernel, e elas continuam livres para o bind explícito do
      # Docker.
      #
      # Depois do checkout porque as portas são LIDAS do `config.toml` — mudou
      # lá, a reserva acompanha sem ninguém lembrar deste passo. E antes de
      # qualquer passo que abra conexão em massa.
      #
      # Só em máquina do GitHub: no executor próprio o runner é um contêiner, e
      # quem publica a porta é o Docker do hospedeiro — a reserva feita aqui
      # dentro não alcançaria o namespace de rede que importa.
      - name: Tirar as portas do Supabase da faixa efêmera
        if: runner.environment == 'github-hosted'
        run: |
          set -euo pipefail
          portas=$(grep -oE '^[[:space:]]*(shadow_)?port[[:space:]]*=[[:space:]]*[0-9]+' supabase/config.toml \
            | grep -oE '[0-9]+$' | sort -un | paste -sd, -)
          if [ -z "$portas" ]; then
            echo "::error::nenhuma porta lida de supabase/config.toml — a sonda perdeu o arquivo, e reservar nada é não reservar"
            exit 1
          fi
          sudo sysctl -w net.ipv4.ip_local_reserved_ports="$portas"
          echo "faixa efêmera: $(cat /proc/sys/net/ipv4/ip_local_port_range) | reservadas: $(cat /proc/sys/net/ipv4/ip_local_reserved_ports)"
          # A reserva vale para conexões NOVAS. Uma já aberta numa destas portas
          # continua lá até fechar — se houver, fica dito aqui, e não no bind.
          abertas=$(ss -Htan | awk '{print $4}' | sed 's/.*://' | sort -u)
          ocupadas=$(comm -12 <(printf '%s\n' "$abertas") <(tr , '\n' <<<"$portas" | sort -u))
          if [ -n "$ocupadas" ]; then
            echo "::warning::porta(s) do Supabase já em uso por conexão aberta antes da reserva: $(echo $ocupadas)"
          fi

      # ─── Serviços da parte 4 — a spec de VPS fresca (issue #179) ──────────
      #
      # Eram `services:` do job, e `services:` é chave do JOB, não do braço da
      # matriz: subiam nas quatro partes e ficavam ociosos em três. Na parte 1
      # do run 35124188017, que não usa nenhum deles, "Initialize containers"
      # custou 51s (quase todos no pull do WAHA), com as partes a ~2 min do
      # teto de 30. Aqui eles sobem por `docker run` SÓ na parte 4 — a alavanca
      # que o comentário do teto, no topo deste job, nomeava.
      #
      # A rede própria devolve o que `services:` dava de graça: o nome `redis`
      # resolvendo para o contêiner do Redis, que é o endereço do
      # serverless-redis-http. As portas publicadas são as mesmas (3000, 6379,
      # 8079), então o passo "Ligar a VPS fresca" — que espera cada serviço
      # RESPONDER e falha fechado — não muda. O passo sobe logo no começo do
      # job para os contêineres ficarem prontos enquanto o Supabase e o build
      # correm; por isso eles continuam nascendo ANTES de o `.env.e2e` existir.
      - if: matrix.parte == 4
        name: Subir WAHA e o par Redis da VPS fresca
        env:
          # Tag PINADA, e a MESMA do `docker-compose.prod.yml`: este job existe
          # para provar o que o self-hoster recebe, e `:latest` deixou de ser
          # isso em 01/09/2026 (o digest do `latest` virou 2026.8.2 enquanto o
          # pin segue em 2026.7.2). Medido no run 35095923107: com `:latest` o
          # contêiner NÃO sobe.
          WAHA_IMAGE: devlikeapro/waha:latest-2026.7.2
          REDIS_IMAGE: redis:7-alpine
          # O MESMO digest do compose: `:latest` é tag móvel. Medido em
          # 2026-09-16 com `docker buildx imagetools inspect`: o `:latest` de
          # então É este índice. Bumpar é junto com o compose.
          SRH_IMAGE: hiett/serverless-redis-http@sha256:5b0bb9239fce53abf87b2018a7a0deb9ec7bd900c5360738fe5fbeeb426f9150
          # Inerte nesta jornada, e escrito para não parecer que funciona: o job
          # roda no host, então o 127.0.0.1 de dentro do WAHA é o próprio WAHA.
          # O que a spec exercita é app→WAHA (o QR), não o webhook de volta.
          WHATSAPP_HOOK_URL: http://127.0.0.1:3001/api/whatsapp/webhook
          # A chave do WAHA tem UMA fonte: `.env.e2e`, gerado por
          # `scripts/gerar-env-e2e.sh` e publicado no ambiente do job. Escrever a
          # chave aqui foi reprovado pelo guard
          # `tests/unit/e2e-workflow-honra-o-env.test.ts` (eram DOIS valores
          # diferentes, e o app levava 401) — e este passo roda ANTES do que
          # publica o arquivo (é o que deixa o pull correr junto com o resto do
          # job), então o contêiner não tem como receber o valor da fonte única.
          #
          # Daí o `WAHA_NO_API_KEY`: sem ele o WAHA NÃO roda sem chave — ele
          # SORTEIA uma no boot. Está no pin, em `core/auth/config.js`:
          # `FromEnv('WAHA_API_KEY', parseBool(process.env.WAHA_NO_API_KEY), rand(), keys)`,
          # e o `ApiKeyAuthFactory` só cai em `NoAuth` quando a chave resolve
          # vazia. Medido no run 35100039158: com a chave sorteada, todo
          # `X-Api-Key` que o CRM manda — o do `.env.e2e` — toma 401, e o
          # serviço fica de pé e inútil. Com `True` a API é pública (o próprio
          # contêiner avisa no log: "No API key detected"), e o que este job
          # exercita é a jornada de onboarding, não o contrato de autenticação do
          # WAHA — esse tem fonte e teste no produto.
          WAHA_NO_API_KEY: "True"
          # O MESMO motor do `docker-compose.prod.yml`
          # (`WHATSAPP_DEFAULT_ENGINE: ${WHATSAPP_DEFAULT_ENGINE:-NOWEB}`). Sem
          # esta linha o contêiner cai no default WEBJS — o log do run
          # 35124188017 mostra `"engine":"WEBJS"` —, e o produto RECUSA essa
          # sessão: `compatibleSession()` em `lib/waha/client.ts` devolve false
          # para qualquer engine que não seja NOWEB, e o `createSession` lança.
          # Com WEBJS a jornada do QR não teria como ficar verde nem com o WAHA
          # alcançável.
          #
          # Limite escrito para não ser descoberto: isto é o WAHA CORE (o mesmo
          # log diz `"tier":"CORE"`), não o WAHA Plus que a doutrina exige em
          # produção. A licença do Plus não pode viver num CI que roda PR de
          # fork sem segredo nenhum. Multi-sessão, retry e S3 — o que só o Plus
          # tem — NÃO são exercitados aqui; a jornada de onboarding é.
          WHATSAPP_DEFAULT_ENGINE: NOWEB
        run: |
          set -euo pipefail
          docker network create vps-fresca

          docker run -d --name redis --network vps-fresca --network-alias redis \
            -p 6379:6379 "$REDIS_IMAGE"
          # O serverless-redis-http conecta no boot: ele só sobe com o Redis de pé.
          for _ in $(seq 1 30); do
            if docker exec redis redis-cli ping 2>/dev/null | grep -q PONG; then break; fi
            sleep 1
          done
          if ! docker exec redis redis-cli ping 2>/dev/null | grep -q PONG; then
            echo "o redis não respondeu PING em 30s"; docker logs --tail 40 redis 2>&1 || true
            exit 1
          fi

          docker run -d --name redis-http --network vps-fresca -p 8079:80 \
            -e SRH_MODE=env -e SRH_TOKEN=e2e-token-nao-e-segredo \
            -e SRH_CONNECTION_STRING=redis://redis:6379 "$SRH_IMAGE"

          docker run -d --name waha -p 3000:3000 \
            -e WHATSAPP_HOOK_URL -e WAHA_NO_API_KEY -e WHATSAPP_DEFAULT_ENGINE "$WAHA_IMAGE"

          docker ps --format '{{.Names}} {{.Image}} {{.Status}} {{.Ports}}'

      - uses: ./.github/actions/preparar-node
        # O teto do preâmbulo mora aqui porque passo de composite action não
        # aceita `timeout-minutes`. Razão e medições: o cabeçalho da action.
        timeout-minutes: 5

      # Versão EXATA, e nunca `latest`: é o CLI que escolhe qual stack o e2e
      # sobe (PostgREST, GoTrue, Storage, Realtime) e o e2e exercita exatamente
      # esse stack. Com `latest`, o registry no minuto do run decidia o produto
      # sob teste — release upstream virava vermelho num PR sem relação.
      # 2.117.0 é o que `latest` apontava em 2026-09-14 (release de 2026-09-07).
      # Subir o pino é ato deliberado: data e razão junto, no mesmo commit.
      # A catraca que reprova `latest`/faixa está em
      # tests/unit/workflows-pinam-o-supabase-cli.test.ts, e roda no job
      # `verify` (o `pnpm test:unit` do ci.yml).
      - uses: supabase/setup-cli@v3
        with:
          version: 2.117.0

      # Sobe Postgres + Auth (GoTrue) + PostgREST + Storage. Auth de verdade é
      # requisito: os specs de login exercitam o GoTrue, não um mock.
      #
      # A pasta de migrations sai do caminho ANTES do start: a cadeia não sobe
      # em banco novo (quebra na 0010, `alter table public.contacts` sobre uma
      # tabela que ainda não existe) — está no CLAUDE.md e foi confirmado neste
      # CI. O que o self-hoster aplica é o `baseline.sql`, então é ele que o
      # e2e aplica: o banco do teste fica igual ao de quem instalou o produto.
      #
      # ⚠️ O PULL DAS IMAGENS BATE NO LIMITE DO REGISTRO, e por isso há laço.
      #
      # Medido em 23/09/2026, run 35908153939: com ~10 PRs disparando CI quase
      # juntos, as CINCO partes morreram aqui com
      #
      #   Error response from daemon: toomanyrequests: retry-after: 913.381µs, allowed: 44000/minute
      #   failed to pull docker image from all registries: ghcr.io/supabase/gotrue:v2.196.0 …
      #
      # O CLI já tenta 3 vezes por imagem, mas com 4s e 8s de espera — tudo
      # dentro do mesmo minuto em que o limite estourou. O laço daqui espera
      # 20s, 60s e 120s, e o `supabase stop` entre tentativas não apaga as
      # camadas já baixadas (ficam no Docker do runner): a tentativa seguinte
      # só baixa o que faltou. Só tenta de novo quando a saída é de pull/rede;
      # qualquer outra falha (porta ocupada, contêiner que não fica saudável)
      # vermelha na hora, sem gastar o relógio da parte.
      #
      # Esperar só não basta, e isso foi MEDIDO: na primeira rodada do PR que
      # criou este laço (run 35910532729), o ghcr.io seguiu recusando por 4,5
      # min, nas 4 tentativas, nas 5 partes. O limite não era rajada de um
      # minuto; era o registro inteiro sob carga. Por isso as tentativas pares
      # trocam de REGISTRO: o `supabase/setup-cli` exporta
      # `SUPABASE_INTERNAL_IMAGE_REGISTRY=ghcr.io`, e o CLI publica as mesmas
      # imagens em `public.ecr.aws` (o default dele sem o setup-cli). As 7
      # tags que este stack sobe responderam 200 lá em 23/09/2026. Camada é
      # endereçada por digest, então o que já veio de um registro não é
      # baixado de novo do outro.
      #
      # `-x studio,postgres-meta`: menos imagens, menos requisições ao
      # registro. Nenhuma spec, script ou passo deste workflow fala com o
      # Studio (porta 54323) nem com o postgres-meta (que só o Studio usa):
      # `grep -rn "54323\|STUDIO_URL\|pgmeta" tests scripts lib app` devolveu
      # vazio em 23/09/2026, e este workflow não cita nenhum dos três fora deste
      # comentário. imgproxy, edge-runtime, logflare e vector já não subiam (o
      # log do run acima não baixa nenhum deles).
      - name: Subir Supabase local (sem a cadeia de migrations)
        run: |
          # O shell padrão do passo é `bash -e`, SEM pipefail: sem esta linha o
          # `supabase start | tee` teria o status do `tee`, e a falha passaria.
          set -euo pipefail
          mv supabase/migrations /tmp/migrations-off
          mkdir -p supabase/migrations
          esperas=(0 20 60 120)
          registros=(ghcr.io public.ecr.aws ghcr.io public.ecr.aws)
          for tentativa in 1 2 3 4; do
            espera=${esperas[$((tentativa - 1))]}
            registro=${registros[$((tentativa - 1))]}
            if [ "$espera" -gt 0 ]; then
              echo "::warning title=supabase start: nova tentativa::tentativa ${tentativa} de 4 daqui a ${espera}s, puxando de ${registro} — a anterior falhou baixando imagem do registro"
              supabase stop --no-backup || true
              sleep "$espera"
            fi
            if SUPABASE_INTERNAL_IMAGE_REGISTRY="$registro" supabase start -x studio,postgres-meta 2>&1 | tee /tmp/supabase-start.log; then
              exit 0
            fi
            if ! grep -qE 'toomanyrequests|failed to pull docker image|error pulling image|TLS handshake timeout|i/o timeout|connection reset by peer' /tmp/supabase-start.log; then
              echo "::error title=supabase start falhou (não é o registro)::a saída acima não tem erro de pull nem de rede, então não há nova tentativa"
              exit 1
            fi
          done
          echo "::error title=supabase start falhou 4 vezes baixando imagens::ghcr.io e public.ecr.aws recusaram o pull nas 4 tentativas (esperas de 20s, 60s e 120s). É limite de taxa ou rede do registro, não o PR — rerode a parte."
          exit 1

      # O baseline é um dump `--schema-only`: ele USA os tipos das extensões
      # (public.vector, citext, gin_trgm_ops) mas não as cria. O stack local do
      # Supabase traz os binários e não as habilita — mesmo prelúdio que o
      # scripts/test-db.sh faz para o Postgres cru, só a parte de extensões
      # (roles e schema auth já vêm prontos aqui).
      - name: Habilitar extensões exigidas pelo baseline
        run: |
          psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" -v ON_ERROR_STOP=1 -q <<'SQL'
          create schema if not exists extensions;
          create extension if not exists "uuid-ossp" with schema extensions;
          create extension if not exists pgcrypto with schema extensions;
          create extension if not exists vector with schema public;
          create extension if not exists citext with schema public;
          create extension if not exists pg_trgm with schema public;
          SQL

      - name: Aplicar o baseline.sql (o mesmo que o install.sh do kit aplica)
        run: |
          psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" \
            -v ON_ERROR_STOP=1 -q -f supabase/baseline.sql

      # A chave de cifra dos segredos, como o install.sh semeia em TODA instalação
      # (`ensure_encryption_key`, em hostgator-setup-kit/_common.sh). Sem ela,
      # `fn_encrypt_oauth` levanta "NUVEMSHOP_OAUTH_ENCRYPTION_KEY ausente" e
      # qualquer tela que guarda segredo cifrado recusa o salvamento — medido na
      # `email-da-instalacao-pela-tela.spec.ts`, a primeira a exercitar isso
      # pela tela: o log do servidor dizia exatamente essa frase, e a senha do
      # SMTP nunca chegava ao banco. O ambiente do e2e imita a VPS recém-
      # instalada; uma VPS recém-instalada TEM essa chave.
      - name: Semear a chave de cifra dos segredos (o que o install.sh faz)
        run: |
          psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" -v ON_ERROR_STOP=1 -q \
            -c "insert into private.app_secrets (name, value) values ('nuvemshop_oauth_key', '$(openssl rand -hex 32)') on conflict (name) do nothing;"

      # ⚠️ O REALTIME PRECISA REINICIAR DEPOIS DO BASELINE — senão ele assina e
      # não entrega, em silêncio.
      #
      # A ordem acima é `supabase start` (que sobe o Realtime) e SÓ DEPOIS o
      # baseline, que é quem adiciona `messages`, `conversations`, `crm_leads` e
      # as demais à publication `supabase_realtime`. O Realtime já subiu com a
      # publication sem essas tabelas e não as reconhece depois.
      #
      # Medido no PR #327, com o defeito atravessando três rodadas: o script de
      # apoio confirmou a gravação (`[e2e-chega-mensagem] entregue em 6f5fd1f2…`)
      # e o snapshot da página no mesmo instante mostrava "Nenhuma mensagem nesta
      # conversa." — gravado no banco, nunca entregue à tela. Canal anônimo e
      # canal sem publication falham do MESMO jeito: respondem SUBSCRIBED e
      # calam, que é a razão de isto ter custado três rodadas de 15 minutos.
      #
      # Na VPS o problema não existe: lá o `install.sh` aplica o baseline e só
      # então o compose sobe os serviços. Reiniciar aqui é o que faz o ambiente
      # do teste refletir o de quem instalou.
      - name: Reiniciar o Realtime (a publication nasceu no passo anterior)
        run: |
          IDS=$(docker ps -q --filter name=supabase_realtime)
          if [ -z "$IDS" ]; then
            echo "::error::Nenhum container supabase_realtime — o stack não subiu como esperado."
            exit 1
          fi
          docker restart $IDS
          # Espera ficar saudável: seguir sem isso devolve o mesmo silêncio que
          # este passo existe para eliminar, só que mais tarde e sem explicação.
          for i in $(seq 1 30); do
            estado=$(docker inspect -f '{{.State.Health.Status}}' $IDS 2>/dev/null || echo desconhecido)
            [ "$estado" = "healthy" ] && { echo "realtime saudável em ~$((i*2))s"; break; }
            sleep 2
          done
          docker inspect -f '{{.State.Health.Status}}' $IDS

      - name: Exportar credenciais do stack local
        run: |
          supabase status -o env > /tmp/sb.env
          {
            echo "NEXT_PUBLIC_SUPABASE_URL=$(grep '^API_URL=' /tmp/sb.env | cut -d'"' -f2)"
            echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=$(grep '^ANON_KEY=' /tmp/sb.env | cut -d'"' -f2)"
            echo "SUPABASE_SERVICE_ROLE_KEY=$(grep '^SERVICE_ROLE_KEY=' /tmp/sb.env | cut -d'"' -f2)"
          } >> "$GITHUB_ENV"

      # O `.env.e2e` é o ambiente da suíte, e ele NASCE aqui — não é opcional.
      #
      # `playwright.config.ts` passou a exigi-lo e a falhar alto quando falta,
      # de propósito: sem ele o `next start` carrega o `.env.local`, que num
      # checkout de trabalho aponta para PRODUÇÃO. O modo de falha que isso
      # substitui é a suíte escrever organizações e usuários de teste no banco
      # real, passando verde.
      #
      # No CI o `.env.local` aponta para o Supabase local, então o risco não é o
      # mesmo — mas o contrato é único, e um workflow que contorna o gate seria
      # o começo de ele não valer para ninguém.
      - name: Gerar o .env.e2e (ambiente da suíte)
        run: pnpm e2e:env

      # E publica o arquivo no ambiente do JOB, para que servidor e testes leiam
      # literalmente a mesma fonte.
      #
      # Sem isto havia duas: o `.env.e2e` (que o playwright.config injeta no
      # `next start`) e um bloco `env:` copiado à mão em cada passo de teste. As
      # duas divergiram — `INTERNAL_SECRET` valia `e2e-placeholder…` no servidor
      # e `ci-placeholder…` no processo de teste. Sintoma medido: 401 em toda
      # chamada a rota interna, 8 specs vermelhas (6 de system-update no
      # heartbeat, o drain do anti-SSRF, e o invite-lifecycle).
      #
      # Medido no Playwright 1.5x: `webServer.env` MESCLA com o ambiente herdado
      # (uma var só do shell chega ao servidor) e VENCE nas colisões. Ou seja,
      # copiar valores à mão nunca ia empatar com o arquivo — só uma fonte
      # empata.
      #
      # De brinde, o processo de teste passa a ver as chaves de CIFRA de verdade
      # (32 bytes, geradas pelo script) em vez do rótulo de 21 caracteres que o
      # bloco `env:` fixava e que o app recusa.
      - name: Publicar o .env.e2e no ambiente do job
        run: grep -vE '^[[:space:]]*(#|$)' .env.e2e >> "$GITHUB_ENV"

      # `pnpm e2e:build`, não `pnpm build`: as três `NEXT_PUBLIC_*` são embutidas
      # no BUNDLE durante o build. Buildar com um env e trocar só no `next start`
      # deixaria a URL errada dentro do JavaScript que roda no browser — servidor
      # falando com um banco e cliente com outro, no mesmo teste.
      - name: Build de produção (com o ambiente do E2E)
        run: pnpm e2e:build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
          # `off`, NÃO vazio. Vazio seleciona o Sentry DA COMUNIDADE — está
          # escrito em lib/sentry/dsn.ts:8-10, e é o default de propósito num
          # produto self-host. Só "off" desliga.
          #
          # Sem isto, o SDK do browser tuneliza por /monitoring (next.config.ts:71)
          # para o Sentry real do projeto, que devolve 429 por cota. Os 429 caem
          # no console, e `olhar-telas-do-epico` — a ÚNICA spec que afirma "não
          # cospe erro no console" — reprova nas 7 telas de uma vez.
          # Medido em 2026-08-10 capturando a URL: /monitoring?o=4509908078559232,
          # que é o org id do DEFAULT_SENTRY_DSN (lib/sentry/dsn.ts:17).
          SENTRY_DSN: "off"

      - name: Instalar o browser
        run: pnpm exec playwright install --with-deps chromium

      # `.env.local` é CÓPIA do `.env.e2e`, não uma terceira redação dele.
      #
      # O arquivo precisa existir porque alguns seeds leem `.env.local` do disco,
      # não de `process.env`. Ele era montado à mão aqui, com os valores
      # redigitados — e foi a terceira fonte do mesmo `INTERNAL_SECRET`, com o
      # terceiro valor. Copiar não pode divergir; redigitar já divergiu.
      #
      # No CI as duas apontam para o mesmo stack local, então a cópia não
      # reintroduz o risco que o `.env.e2e` existe para evitar (o `.env.local` de
      # um checkout de trabalho apontar para produção).
      #
      # O seed cria 1 org + 4 usuários com os 4 papéis e um TOTP verified de
      # secret conhecido no admin — sem ele, todo spec que loga fica de fora, que
      # era a maior parte da suíte.
      # ─── A parte fresca: WAHA, Redis e o dublê de SaaS, antes da spec ──────
      #
      # O dublê é exercitado pelo SMOKE antes da spec: se ele não responder o
      # contrato, o job falha aqui, com a rota nomeada, em vez de falhar seis
      # minutos depois dentro do Playwright com "elemento não encontrado".
      - if: matrix.parte == 4
        name: Ligar a VPS fresca (WAHA, Redis e dublê de SaaS)
        run: |
          set -euo pipefail

          # 1. O dublê de Resend/Nuvemshop: processo separado, porta de verdade.
          nohup node scripts/duble-saas-e2e.mjs >/tmp/duble-saas.log 2>&1 &
          for _ in $(seq 1 30); do
            if curl -sf http://127.0.0.1:3997/__duble/saude >/dev/null; then break; fi
            sleep 1
          done
          cat /tmp/duble-saas.log
          bash scripts/duble-saas-e2e-smoke.sh

          # 2. O que a spec fresca exige do ambiente (cabeçalho dela):
          #    WAHA ativo, Redis local, e Resend SEM chave — instalação nova não
          #    tem chave de SaaS nenhuma, e é isso que a spec cobra.
          {
            # `WAHA_API_KEY` NÃO entra aqui: ela vem do `.env.e2e` (fonte única,
            # já publicada no ambiente do job). Redigitá-la — com outro valor,
            # que era o caso — é a segunda fonte que o guard
            # `tests/unit/e2e-workflow-honra-o-env.test.ts` reprova.
            echo "WAHA_API_BASE_URL=http://127.0.0.1:3000"
            echo "UPSTASH_REDIS_REST_URL=http://127.0.0.1:8079"
            echo "UPSTASH_REDIS_REST_TOKEN=e2e-token-nao-e-segredo"
            echo "RESEND_API_BASE_URL=http://127.0.0.1:3997"
            echo "RESEND_API_KEY="
            echo "NUVEMSHOP_AUTH_BASE=http://127.0.0.1:3997"
            echo "NUVEMSHOP_API_BASE=http://127.0.0.1:3997"
            echo "NUVEMSHOP_CLIENT_ID=e2e-app-id"
            echo "NUVEMSHOP_CLIENT_SECRET=e2e-placeholder-nao-e-segredo"
          } > /tmp/vps-fresca.env

          #    ⚠️ Estes valores vão para DENTRO do `.env.e2e`, não só para o
          #    `$GITHUB_ENV` — senão o SERVIDOR nunca os vê.
          #
          #    O `playwright.config.ts` injeta o `.env.e2e` em `webServer.env`, e
          #    ali a regra medida (escrita no próprio config) é: chave nos dois
          #    lados, vence a do `.env.e2e`. O gerador escreve
          #    `WAHA_API_BASE_URL=…:3999` e `UPSTASH_REDIS_REST_URL=…:3998`
          #    (portas onde nada escuta), então só anexar ao `$GITHUB_ENV` dava
          #    3000/8079 ao processo de TESTE e 3999/3998 ao app. Medido no run
          #    35124188017 (parte 4): o contêiner do WAHA registrou DUAS
          #    requisições no job inteiro — a sonda deste passo e o `beforeAll`
          #    da spec, que leem o ambiente do processo —, e nenhuma do app. No
          #    trace, o POST de sessão do onboarding voltou 502 sem `details`
          #    (nenhuma resposta HTTP do WAHA) e os 19 GETs de status, 502. As 6
          #    linhas `redis incr failed … fetch failed` do app são a mesma
          #    causa, do lado do Redis.
          #
          #    Trocar as linhas NO arquivo mantém a fonte única: servidor, testes,
          #    `.env.local` (copiado logo abaixo) e `$GITHUB_ENV` leem o mesmo.
          chaves=$(cut -d= -f1 /tmp/vps-fresca.env | paste -sd'|' -)
          grep -vE "^(${chaves})=" .env.e2e > /tmp/env-e2e-sem-parte-4
          cat /tmp/env-e2e-sem-parte-4 /tmp/vps-fresca.env > .env.e2e
          cat /tmp/vps-fresca.env >> "$GITHUB_ENV"
          echo "--- o que o app da parte 4 recebe do .env.e2e ---"
          grep -E "^(${chaves})=" .env.e2e

          # 3. A cadeia de Redis, provada pelo protocolo que o produto usa: um
          #    comando Upstash REST de verdade, que só responde PONG se o
          #    serverless-redis-http estiver de pé E falando com o redis:7.
          #
          #    Falha FECHADO, como o laço do WAHA logo abaixo. A versão anterior
          #    terminava o `for` sem `exit 1`: nas 30 voltas sem PONG o passo
          #    seguia verde e o vermelho aparecia minutos depois, dentro do
          #    Playwright, sem nome. Medido no run 35124188017 (parte 4): a linha
          #    "pronto" nunca foi impressa, 30,3s de vão entre o smoke do dublê e
          #    o WAHA, e o passo verde.
          #
          #    O `Content-Type` é o motivo de nunca ter passado. Sem ele o `curl
          #    -d` manda `application/x-www-form-urlencoded`, e o
          #    serverless-redis-http recusa: HTTP 400 `{"error":"Invalid content
          #    type. Expected application/json."}`. Com ele: 200
          #    `{"result":"PONG"}`. Medido contra o MESMO digest do
          #    `docker-compose.prod.yml`, com o redis:7-alpine atrás. O SDK
          #    `@upstash/redis` do produto manda o cabeçalho; a sonda tem de
          #    mandar também, senão prova um protocolo que ninguém usa.
          redis_pronto=""
          for _ in $(seq 1 30); do
            resposta=$(curl -s -X POST \
              -H "Authorization: Bearer e2e-token-nao-e-segredo" \
              -H "Content-Type: application/json" \
              -d '["PING"]' -w ' http=%{http_code}' \
              http://127.0.0.1:8079/ || true)
            if printf '%s' "$resposta" | grep -q PONG; then
              echo "Redis (REST do Upstash) pronto"
              redis_pronto=1
              break
            fi
            sleep 1
          done
          if [ -z "$redis_pronto" ]; then
            echo "Redis (REST do Upstash) não respondeu PONG em 30s: $resposta"
            echo "--- o que os contêineres do Redis dizem ---"
            docker ps -a --filter name=redis --format '{{.Names}} {{.Status}} {{.Ports}}' || true
            docker logs --tail 40 redis-http 2>&1 || true
            exit 1
          fi

          # 4. Alguns scripts leem o disco em vez do ambiente.
          cp .env.e2e .env.local

          # 5. Espera o WAHA responder DE VERDADE antes de entregar o turno para o
          #    Playwright, e sonda a rota que o CRM usa (`/api/sessions`, com a
          #    MESMA chave do `.env.e2e`). O passo antigo esperava
          #    `curl -sf http://127.0.0.1:3000/api/health`: rota que NÃO EXISTE
          #    neste pin — o health é `/health` (e exige chave); `/ping` é o único
          #    endpoint público. Eram 404 a cada volta, 120s de espera e o job
          #    vermelho em "WAHA não respondeu" (run 35100039158). `/ping` sozinho
          #    diria apenas que o processo subiu, não que o CRM consegue falar com
          #    ele.
          for _ in $(seq 1 60); do
            ping=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:3000/ping || true)
            sessoes=$(curl -s -o /dev/null -w '%{http_code}' -H "X-Api-Key: $WAHA_API_KEY" \
              "http://127.0.0.1:3000/api/sessions?all=true" || true)
            if [ "$ping" = "200" ] && [ "$sessoes" = "200" ]; then
              echo "WAHA pronto (/ping 200 · /api/sessions 200)"
              exit 0
            fi
            sleep 2
          done
          echo "WAHA não respondeu em 120s: /ping=$ping · /api/sessions=$sessoes"
          echo "--- o que o contêiner do WAHA diz ---"
          docker ps -a --filter name=waha --format '{{.Names}} {{.Status}} {{.Ports}}' || true
          docker logs --tail 40 waha 2>&1 || true
          exit 1

      # ─── O dono da instalação fresca: o `install.sh` cria, e o CI também ───
      #
      # PRECONDIÇÃO da spec, declarada por ela no cabeçalho: "primeiro usuário
      # criado via scripts/bootstrap-owner.ts (como o install.sh)". Sem este
      # passo o `beforeAll` dela morre antes do primeiro teste, com
      # "esta suite APAGA dados da organizacao que resolver aqui, e nao achou o
      # dono (dono@qa.local)" — a spec é destrutiva e se recusa a escolher a
      # organização no escuro (a versão antiga escolhia "a primeira" e zerou o
      # onboarding e a sessão de WhatsApp de uma instalação de trabalho).
      #
      # O que este passo NÃO faz: não semeia fixture, não pula wizard, não
      # inventa tenant. Ele cria exatamente o que o `install.sh` cria numa VPS
      # recém-instalada — dono (auth, e-mail confirmado), organização, vínculo
      # como `admin` e a linha em `platform_admins` — e entrega a jornada
      # (wizard, WhatsApp, convites) para a spec percorrer.
      #
      # As credenciais do dono não estão escritas aqui: vêm do `.env.e2e`, que
      # é a fonte única do ambiente da suíte e já foi publicada no job no passo
      # "Publicar o .env.e2e no ambiente do job". O script lê o ambiente.
      - if: matrix.parte == 4
        name: Criar o dono da instalação (como o install.sh)
        run: pnpm exec tsx scripts/bootstrap-owner.ts

      - if: matrix.parte != 4
        name: Semear credenciais de teste
        run: |
          cp .env.e2e .env.local
          pnpm exec tsx scripts/seed-e2e-credentials.ts

      # `SUPABASE_DB_URL` no `.env.local` (e não só no `env:` do passo de teste):
      # `seed-e2e-escalacao.ts` abre um `pg.Pool` direto, e o `.env.local` é a
      # única fonte que ele lê. Sem a linha, o `pg` cai no default 5432 e morre
      # com ECONNREFUSED — o stack local do Supabase publica o Postgres na 54322.
      # Medido: foi exatamente assim que a primeira execução deste passo falhou.
      #
      # A maioria das specs roda o próprio seed num `beforeAll`. Estas TRÊS não
      # — ou o cabeçalho manda rodar à mão, ou a fixture é de outra spec.
      #
      # `seed-e2e-followup-agent` (credencial de IA + sessão de canal) é o caso
      # sutil: `followup-builder` o roda no próprio `beforeAll`, mas
      # `agente-novo-e-uso` PRECISA das mesmas fixtures e vem ANTES na ordem
      # alfabética — em banco fresco os comboboxes de credencial e canal abrem
      # com a opção desabilitada e o clique estoura por timeout. Medido: o
      # ensaio local passou porque o banco tinha as fixtures de uma rodada
      # anterior; o CI, fresco, reprovou. Rodar aqui torna a precondição
      # explícita em vez de depender da ordem dos arquivos.
      #
      # `--env-file` só na segunda, e a diferença não é capricho: o seed de
      # capacidades importa `lib/env.ts` (via lib/ai/embed.ts), que lê
      # `process.env`; o de escalação parseia o `.env.local` por conta própria.
      # Sem a flag o de capacidades morre na validação Zod das 3 vars do Supabase.
      - if: matrix.parte != 4
        name: Semear as fixtures que as specs não semeiam sozinhas
        run: |
          pnpm exec tsx scripts/seed-e2e-escalacao.ts
          pnpm exec tsx --env-file=.env.local scripts/seed-e2e-capacidades-ausentes.ts
          pnpm exec tsx scripts/seed-e2e-followup-agent.ts
          # O catálogo da OpenRouter não existe em banco fresco (o baseline
          # semeia só anthropic/openai/google; os demais vêm do cron diário, que
          # busca na internet). Sem esta linha, `prova-painel-provedores` mede a
          # sorte do ambiente em vez da tela.
          pnpm exec tsx scripts/seed-e2e-catalogo-openrouter.ts

      # O que ficou DE FORA (e por quê) é declarado no passo de summary —
      # cobertura parcial silenciosa se lê como cobertura total.
      #
      # `next start` roda com NODE_ENV=production, e aí toda var marcada
      # `required()` no lib/env.ts vira obrigatória, inclusive as de serviço que
      # estes specs nem tocam. Os valores abaixo são PLACEHOLDERS FALSOS, só
      # para o boot passar da validação Zod — nenhum segredo real entra aqui.
      # DUAS INVOCAÇÕES, e não uma — o motivo é medido, não estético.
      #
      # `lib/auth/rate-limit.ts` limita login a 60 por IP a cada 300s. No CI todo
      # spec loga do mesmo 127.0.0.1, e ao subir a suíte de 15 para 29 specs o
      # pico passou a ser 69–73 tentativas na janela: a suíte estourava o próprio
      # teto do produto. O sintoma não é honesto — o login simplesmente não
      # redireciona, e a spec sorteada pelo momento da saturação é a que falha.
      # Foi assim que `risk-radar` caiu na main e `rbac-roles` num PR, sem
      # nenhuma das duas ter mudado.
      #
      # Sem Upstash configurado, o limitador cai para memória DO PROCESSO (o log
      # diz: "redis incr failed; falling back to in-memory"), e o
      # `reuseExistingServer: false` do playwright.config.ts faz cada invocação
      # subir o SEU `next start`. Duas invocações = dois processos = dois
      # contadores, e o pico por processo volta para ~40.
      #
      # A alternativa seria afrouxar o teto por env — mexer num controle de
      # segurança para acomodar o teste, que é a troca errada.
      #
      # `--workers=1` não é preciosismo: os specs compartilham UMA conta admin
      # com MFA, e código TOTP é de uso único por janela no GoTrue. Com dois
      # workers, dois specs gerando o mesmo código no mesmo intervalo de 30s
      # fazem o segundo ser recusado como replay. Foi o que derrubava a
      # `reset-password-mfa` (issue #80): ela passa sozinha e falha em paralelo.
      - name: E2E — parte ${{ matrix.parte }} de 4
        run: |
          set -euo pipefail
          # A lista sai da matrix, e as duas variáveis continuam existindo no
          # `env:` do job porque é DELAS que `e2e-cobertura-completa.test.ts` lê
          # a cobertura. Ler por indireção aqui e não duplicar a lista mantém
          # UMA fonte por parte.
          case "${{ matrix.parte }}" in
            1) LISTA="$SPECS_PARTE_1" ;;
            2) LISTA="$SPECS_PARTE_2" ;;
            3) LISTA="$SPECS_PARTE_3" ;;
            4) LISTA="$SPECS_PARTE_4" ;;
            5) LISTA="$SPECS_PARTE_5" ;;
            *) echo "::error::parte ${{ matrix.parte }} sem lista"; exit 1 ;;
          esac
          # Falha alto se a variável vier vazia: sem isto, um typo no nome faria
          # o playwright rodar a suíte INTEIRA (ou nenhuma) e o job ficaria
          # verde medindo outra coisa.
          [ -n "$LISTA" ] || { echo "::error::lista da parte ${{ matrix.parte }} vazia"; exit 1; }
          # `--reporter=list` NÃO é preferência de leitura: é o INSTRUMENTO que
          # mede o custo de cada spec, e sem ele a partição das listas volta
          # a ser chutada.
          #
          # O reporter default em CI é o `dot`, e ele destrói justamente o dado
          # que decide o balanceamento: os pontos saem em rajada, esvaziados só
          # quando outro processo escreve na saída, e o timestamp do Actions é
          # por LINHA. Medido no run 33820766602 (verde): a parte 1 despejou
          # **37 pontos numa linha só**, cobrindo 4,9 min — 37 testes que se
          # tornam indistinguíveis entre si. Reconstruir tempo por spec a partir
          # disso é o terceiro proxy ruim que este arquivo já viu, e os dois
          # anteriores INVERTERAM o sinal da medição (ver o bloco de
          # `SPECS_PARTE_1` abaixo).
          #
          # Com o `list`, cada teste vira uma linha com caminho e duração
          # (`✓ 12 [chromium] › tests/e2e/x.spec.ts:9:5 › título (3.4s)`), e a
          # soma por arquivo sai de um `gh run view <id> --log`. Custo medido:
          # ~240 linhas a mais de log, zero segundo de execução.
          # ── O AVISO, ANTES DO CORTE ───────────────────────────────────────
          # Daqui para baixo o relógio que decide é o do JOB, não o da suíte.
          # A conta é medida, não estimada: DECORRIDO é o que esta parte já
          # gastou desde o T0 (checkout, node, stack do Supabase, baseline,
          # build), e é ele que come a folga do teto de 30 min.
          #
          # O `timeout` abaixo é o AVISO ANTES DO CORTE. Sem ele, quem corta é
          # o `timeout-minutes` do job — que cancela sem dizer do que se
          # tratava, com a suíte ainda verde no caso 141 de 156 (run
          # 35160549180). Com ele, a suíte é interrompida MARGEM_SEGUNDOS antes
          # do teto e o erro nomeia a parte com os números na mão.
          PARTE="${{ matrix.parte }}"
          AGORA=$(date -u +%s)
          DECORRIDO=$(( AGORA - T0_JOB ))
          FOLGA=$(( TETO_SEGUNDOS - MARGEM_SEGUNDOS - (AGORA - T0_JOB) ))
          if [ "$FOLGA" -lt "$PISO_SEGUNDOS" ]; then
            echo "::error title=A parte ${PARTE} chegou à suíte sem folga até o teto::o preparo custou ${DECORRIDO}s e sobravam ${FOLGA}s para uma suíte de centenas de casos, num teto de $(( TETO_SEGUNDOS / 60 )) min. Não é infraestrutura: a parte cresceu além do orçamento de $(( ORCAMENTO_SEGUNDOS / 60 )) min — rebalanceie as listas ou reparta em mais uma parte."
            exit 1
          fi
          echo "::notice title=A parte ${PARTE} entrou na suíte com ${FOLGA}s de folga::preparo de ${DECORRIDO}s; teto do job de $(( TETO_SEGUNDOS / 60 )) min"
          INICIO_SUITE=$(date -u +%s)
          # `-k 30` manda SIGKILL 30 s depois do TERM: o TERM deixa o Playwright
          # escrever o relatório, o KILL garante que o job não pare no meio de um
          # spec que ignorou o sinal.
          # A saída vai para arquivo TAMBÉM, e não só para o log do Actions: é
          # dela que sai (a) a contagem de casos já vermelhos quando o corte
          # chega e (b) os specs mais lentos da rodada, no resumo. `PIPESTATUS`
          # porque com `| tee` o `$?` seria o do tee — sempre 0.
          SAIDA="${RUNNER_TEMP}/e2e-parte-${PARTE}.log"
          set +e
          timeout -k 30 --signal=TERM "${FOLGA}s" pnpm exec playwright test --workers=1 $LISTA --reporter=list 2>&1 | tee "$SAIDA"
          CODIGO=${PIPESTATUS[0]}
          set -e
          echo "SAIDA_DA_SUITE=${SAIDA}" >> "$GITHUB_ENV"
          SUITE=$(( $(date -u +%s) - INICIO_SUITE ))
          {
            echo "SUITE_SEGUNDOS=${SUITE}"
            echo "CUSTO_FIXO_SEGUNDOS=${DECORRIDO}"
          } >> "$GITHUB_ENV"
          # 124 = o `timeout` cortou; 137 = o KILL da carência chegou antes.
          # ── O CORTE NÃO PODE AFIRMAR "a parte cresceu" SEM OLHAR O VERMELHO ──
          #
          # Medido no #1210 (job 105739419202, parte 1): o `timeout` matou a
          # suíte ANTES de o Playwright imprimir o sumário, então o único
          # vestígio do caso que falhou era a linha `✘` no meio do log. O
          # resumo do job dizia só "a parte cresceu" — e o time saiu
          # rebalancear a partição. A parte estava saudável (797–933 s de
          # suíte em quatro rodadas do mesmo dia): o que estourou o relógio foi
          # UM caso vermelho de `followup-ramos.spec.ts`, que declara
          # `test.setTimeout(420_000)` e, ao travar, queima 7 min sozinho —
          # 29% do orçamento. Há specs com 480 e 600 s declarados; qualquer uma
          # delas, travando, cabe nesta mesma armadilha.
          #
          # Então o corte passa a CONTAR os vermelhos antes de diagnosticar.
          if [ "$CODIGO" -eq 124 ] || [ "$CODIGO" -eq 137 ]; then
            # O padrão casa a linha do reporter `list` pelo FORMATO
            # (`✘   36 [chromium] › …`), não pelo começo da linha: âncora em
            # `^` só funciona no arquivo cru, e some no mesmo log baixado pela
            # API do GitHub, que prefixa carimbo de hora. Uma sonda que depende
            # do prefixo devolve zero — e zero aqui lê como "não havia vermelho".
            PADRAO_VERMELHO="✘[[:space:]]+[0-9]+[[:space:]]+\["
            # FALHA ESPERADA NÃO É VERMELHO. Spec que declara `test.fail(...)`
            # (catraca de lacuna conhecida) é impressa com o MESMO `✘`, e a rodada
            # termina verde — medido no run 35388254053, parte 1:
            # `degradacao-silenciosa.spec.ts` sai com ✘ e o job fecha "150 passed".
            # Contá-la aqui inverteria o erro: em vez de calar o vermelho, eu
            # inventaria um.
            ESPERADAS=$(grep -rlE "^[[:space:]]*test\.fail\(" tests/e2e --include="*.spec.ts" 2>/dev/null | sed "s|.*/||" | paste -sd"|" - || true)
            SEM_ESPERADAS="tests/e2e/(${ESPERADAS:-nada-casa-aqui}):"
            VERMELHOS=$(grep -aE "$PADRAO_VERMELHO" "$SAIDA" | grep -acvE "$SEM_ESPERADAS" || true)
            if [ "${VERMELHOS:-0}" -gt 0 ]; then
              echo "::error title=A parte ${PARTE} foi cortada pelo relógio, e já havia ${VERMELHOS} caso(s) VERMELHO(s) antes do corte::o corte veio aos ${SUITE}s (preparo de ${DECORRIDO}s, teto de $(( TETO_SEGUNDOS / 60 )) min), mas a suíte NÃO estava só grande: conserte o vermelho abaixo antes de concluir qualquer coisa sobre a partição. Caso que falha por tempo esgotado queima o timeout declarado no próprio spec (há specs com 420–600 s)."
              grep -aE "$PADRAO_VERMELHO" "$SAIDA" | grep -avE "$SEM_ESPERADAS" | head -10
            else
              echo "::error title=A parte ${PARTE} estourou o relógio do e2e::a suíte rodou ${SUITE}s e foi interrompida ${FOLGA}s depois de entrar, o job já tinha ${DECORRIDO}s de preparo e o teto é de $(( TETO_SEGUNDOS / 60 )) min (orçamento: $(( ORCAMENTO_SEGUNDOS / 60 )) min). Nenhum caso vermelho até o corte: a parte cresceu."
            fi
          fi
          exit "$CODIGO"
        env:
          # Só o que NÃO vem do `.env.e2e`: isto é ajuste de CI, não config do
          # produto. CI = 1 IP para todos os specs, e o teto de produção
          # (60/5min) é irreal aqui. O teto por CONTA (5 falhas) NÃO muda — é
          # ele que barra brute force.
          AUTH_RATE_LIMIT_LOGIN_IP: "1000"
          # ver o comentário do passo de build: vazio NÃO desliga.
          SENTRY_DSN: "off"

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report-parte-${{ matrix.parte }}
          path: |
            playwright-report/
            test-results/
          retention-days: 7

      # ── ONDE A MEDIÇÃO FICA ───────────────────────────────────────────────
      # A medição que só existe no log se perde: quem decide repartir as listas
      # é quem olha o resumo do job, e o resumo é este. Os três relógios saem
      # por parte, com o teto ao lado para o número ser lido contra alguma coisa.
      #
      # `if: always()` de propósito: o caso que interessa é justamente o da
      # parte que falhou ou que foi cortada pelo `timeout` — sem o `always`, o
      # resumo apareceria só nas rodadas em que nada aconteceu.
      - name: Publicar o relógio da parte ${{ matrix.parte }} (preparo × suíte × teto)
        if: always()
        run: |
          set -euo pipefail
          PARTE="${{ matrix.parte }}"
          # `não medido` quando o passo da suíte não chegou a publicar (parte
          # que entrou sem folga até o teto): zero ali seria um número falso.
          SUITE="${SUITE_SEGUNDOS:-não medido}"
          FIXO="${CUSTO_FIXO_SEGUNDOS:-não medido}"
          if [ -n "${T0_JOB:-}" ]; then
            TOTAL=$(( $(date -u +%s) - T0_JOB ))
          else
            TOTAL=0
          fi
          # Aviso ANTES do corte: a parte que passou do orçamento mas ainda não
          # estourou o teto. É esta a linha que evita o próximo "cancelado com
          # 141 de 156 verde" — o orçamento estourado aparece numa rodada ainda
          # verde, não na rodada em que o teto já cortou tudo.
          if [ "$TOTAL" -gt "$ORCAMENTO_SEGUNDOS" ]; then
            echo "::warning title=A parte ${PARTE} passou do orçamento do e2e::${TOTAL}s de relógio do job contra o orçamento de $(( ORCAMENTO_SEGUNDOS / 60 )) min (teto de $(( TETO_SEGUNDOS / 60 )) min). Ainda não estourou, mas a partição está desbalanceada: o bloco de partição das listas, no cabeçalho deste workflow, diz onde mexer."
          fi
          {
            echo "## E2E parte ${PARTE} — o relógio da rodada"
            echo ""
            echo "| relógio | medido | referência |"
            echo "| --- | --- | --- |"
            echo "| preparo (primeiro passo → suíte) | ${FIXO}s | — |"
            echo "| suíte (Playwright) | ${SUITE}s | — |"
            echo "| **total da parte** | **${TOTAL}s** | orçamento $(( ORCAMENTO_SEGUNDOS / 60 )) min · teto $(( TETO_SEGUNDOS / 60 )) min |"
            echo ""
            echo ""
            # ── OS SPECS MAIS LENTOS DA RODADA, NO RESUMO ───────────────────
            # Quem decide rebalancear precisa do tempo POR SPEC, e ele só
            # existia no log, linha a linha: para diagnosticar o #1210 foi
            # preciso baixar o log do job e somar as durações na mão. Com a
            # tabela abaixo, a próxima partição é decidida lendo o resumo — e
            # um caso que sozinho come minutos (há specs com `setTimeout` de
            # 420–600 s) aparece no topo em vez de se esconder na soma.
            if [ -s "${SAIDA_DA_SUITE:-/inexistente}" ]; then
              echo "### Os 5 specs mais caros desta parte"
              echo ""
              echo "| spec | segundos | casos |"
              echo "| --- | --- | --- |"
              awk '
            match($0, /tests\/e2e\/[A-Za-z0-9._-]+\.spec\.ts/) {
              nome = substr($0, RSTART + 10, RLENGTH - 10)
              if (match($0, /\([0-9.]+(ms|s|m)\)[ \r]*$/)) {
                bruto = substr($0, RSTART + 1, RLENGTH - 2)
                sub(/[ \r]+$/, "", bruto)
                if (bruto ~ /ms\)?$/) { sub(/ms.*/, "", bruto); seg = bruto / 1000 }
                else if (bruto ~ /m\)?$/) { sub(/m.*/, "", bruto); seg = bruto * 60 }
                else { sub(/s.*/, "", bruto); seg = bruto }
                total[nome] += seg; casos[nome] += 1; soma += seg; casosTotal += 1
              }
            }
            END {
              n = 0
              for (k in total) { ordem[++n] = k }
              for (i = 1; i < n; i++) for (j = i + 1; j <= n; j++) if (total[ordem[j]] > total[ordem[i]]) { t = ordem[i]; ordem[i] = ordem[j]; ordem[j] = t }
              for (i = 1; i <= n && i <= 5; i++) printf "| `%s` | %.0f | %d |\n", ordem[i], total[ordem[i]], casos[ordem[i]]
              printf "| **soma da suíte** | **%.0f** | **%d casos** |\n", soma, casosTotal
            }
              ' "$SAIDA_DA_SUITE"
              echo ""
            fi
            echo "O teto continua sendo o \`timeout-minutes: $(( TETO_SEGUNDOS / 60 ))\` do job — é ele que"
            echo "denuncia a parte crescendo. Quem corta primeiro é o \`timeout\` que dá"
            echo "$(( MARGEM_SEGUNDOS / 60 )) min de folga à suíte, para o vermelho dizer o NOME do problema"
            echo "(qual parte, com quantos segundos medidos) em vez de cancelar em silêncio."
          } >> "$GITHUB_STEP_SUMMARY"

  # O NOME DESTE JOB É O CHECK OBRIGATÓRIO, e é por isso que ele existe.
  #
  # A branch protection da `main` exige um check chamado exatamente `e2e`
  # (medido: verify, build-and-size, invariants, e2e, imagens-ok). Jobs de
  # matrix se chamam `e2e-parte (1)` e `e2e-parte (2)` — se o job das partes
  # tivesse ficado com o nome `e2e`, a proteção passaria a esperar para sempre
  # um check que nenhum run produz, e NENHUM PR mergearia. Este agregador é o
  # mesmo padrão do `imagens-ok` em `publish-image.yml`.
  e2e:
    if: always()
    needs: [e2e-alcance, e2e-parte]
    runs-on: ubuntu-latest
    # Nenhuma permissão: este job só lê o resultado de `needs` e escreve o
    # summary. Sem o bloco, o token herdaria o default do REPOSITÓRIO, que vive
    # fora do repo e muda num clique.
    permissions: {}
    steps:
      - name: Falhar se qualquer parte não passou
        env:
          EVENTO: ${{ github.event_name }}
          PORTAO: ${{ needs.e2e-alcance.result }}
          ALCANCE: ${{ needs.e2e-alcance.outputs.e2e }}
          PARTES: ${{ needs.e2e-parte.result }}
        run: |
          set -euo pipefail
          echo "evento=${EVENTO} e2e-alcance=${PORTAO} e2e=${ALCANCE:-<vazio>}"
          echo "e2e-parte: ${PARTES}"
          # A pergunta tem de ter sido RESPONDIDA: job de alcance que falhou
          # deixa as partes `skipped`, e isso não pode ler como aprovação.
          [ "$PORTAO" = "success" ]
          # `skipped` das partes só é aceito com `e2e=nao` em pull_request — PR
          # que não alcança nada que o e2e mede (scripts/pr-alcanca-o-e2e.sh).
          # Qualquer outra combinação exige `success`: parte pulada não mediu
          # nada, e ler isso como aprovação é o modo de falha que o `imagens-ok`
          # documenta.
          if [ "$EVENTO" = "pull_request" ] && [ "$ALCANCE" = "nao" ]; then
            [ "$PARTES" = "skipped" ]
            echo "PR não alcança nada que o e2e mede — partes puladas (scripts/pr-alcanca-o-e2e.sh)" | tee -a "$GITHUB_STEP_SUMMARY"
          else
            [ "$PARTES" = "success" ]
          fi

      - uses: actions/checkout@v7
        if: always()

      - name: Declarar o que este job ainda NÃO cobre
        if: always()
        run: |
          set -euo pipefail
          # CONTA, não afirma. A versão anterior deste passo era prosa digitada à
          # mão e dizia "32 de 33" com 39 arquivos no disco — a única coisa que
          # existia para declarar a lacuna estava, ela mesma, desatualizada.
          #
          # As listas saem do PRÓPRIO workflow, com recorte por bloco. Contar com
          # um `grep` no arquivo inteiro daria número MAIOR: os nomes aparecem
          # também em comentários, e foi assim que a contagem antiga mentiu.
          #
          # ⚠️ O RECORTE PARA DE SER POR RANGE DE `sed` — ele lia COMENTÁRIO.
          #
          # A versão anterior era `sed -n "/^      $1: >-/,/^      [A-Z_0-9]*:/p"`,
          # e o `[A-Z_0-9]` incluía DÍGITO de propósito: sem ele o range de
          # `SPECS_PARTE_1` não parava em `SPECS_PARTE_2` (que tem `2` no nome) e
          # seguia até `FORA_DO_CI`, devolvendo a união das duas como se fosse a
          # parte 1. Medido antes daquele conserto: 67 em vez de 29.
          #
          # O que aquele conserto não alcançou é que o range NÃO PARA no fim do
          # bloco `>-`: ele para na próxima CHAVE, e entre uma coisa e outra
          # moram os comentários — que citam nome de spec o tempo todo. Medido
          # neste arquivo, contra a lista de verdade:
          #
          #   SPECS_PARTE_1  real 30 · sed 31  (extra: `marca-logo`, citada no comentário)
          #   SPECS_PARTE_2  real 43 · sed 44  (extra: `signup-journey`, idem)
          #   FORA_DO_CI     real  2 · sed  3  (extra: um exemplo de saída do reporter)
          #
          # Nas duas primeiras o erro se anula na CONTA — as extras já estão na
          # outra lista, e `RODOU` é união. Na terceira, não: `FORA_DO_CI` é a
          # única lista impressa NOME A NOME, e o range dela vai até o fim do
          # arquivo (nenhuma chave de 6 espaços vem depois). Qualquer comentário
          # abaixo dela que cite um `.spec.ts` vira uma linha a mais em "Não
          # rodou", com o motivo alheio colado — a declaração de cobertura
          # afirmando falso sobre si mesma, que é a classe inteira que este
          # passo existe para matar.
          #
          # O `awk` abaixo recorta o BLOCO: entra na chave, imprime enquanto as
          # linhas forem continuação (8 espaços), e sai na primeira que não for
          # — comentário de 6 espaços inclusive.
          bloco() { awk -v k="$1" '
                      index($0, "      " k ": >-") == 1 { dentro = 1; next }
                      dentro && substr($0, 1, 8) == "        " && substr($0, 9, 1) != " " { print; next }
                      dentro { exit }
                    ' .github/workflows/e2e.yml | grep -oE "[a-z0-9-]+\.spec\.ts" | sort -u; }
          NO_DISCO=$(ls tests/e2e/*.spec.ts | wc -l | tr -d " ")
          RODOU=$( { bloco SPECS_PARTE_1; bloco SPECS_PARTE_2; bloco SPECS_PARTE_3; bloco SPECS_PARTE_4; bloco SPECS_PARTE_5; } | sort -u | wc -l | tr -d " ")
          FORA_LISTA=$(bloco FORA_DO_CI)
          FORA=$(echo "$FORA_LISTA" | grep -c . || true)
          # E o recorte passa a ter CONTROLE, não só um piso.
          #
          # `tests/unit/e2e-cobertura-completa.test.ts` já garante que toda spec
          # do disco está em exatamente uma das quatro listas, sem duplicata e sem
          # fantasma. Logo `RODOU + FORA` TEM de dar `NO_DISCO` — e quando não
          # der, o recorte leu a mais ou a menos. Sem esta linha, ler a mais é
          # invisível: o passo imprime um número maior e segue verde, que é
          # exatamente como a contagem antiga mentiu por três versões seguidas.
          if [ "$((RODOU + FORA))" -ne "$NO_DISCO" ]; then
            echo "::error::recorte das listas divergiu — rodou=$RODOU fora=$FORA disco=$NO_DISCO"
            exit 1
          fi
          # Falha alto se o recorte parou de casar: listas vazias fariam este
          # passo anunciar "0 de N" como se fosse notícia, em vez de erro.
          [ "$RODOU" -gt 10 ] || { echo "::error::o recorte das listas do workflow parou de casar"; exit 1; }
          {
            echo "## E2E — cobertura deste job"
            echo ""
            echo "**Rodou: ${RODOU} de ${NO_DISCO} specs**, em partes paralelas."
            echo ""
            echo "**Não rodou (${FORA}):**"
            for s in $FORA_LISTA; do echo "- \`${s}\` — fora do CI de propósito: o motivo de cada uma está no comentário do bloco FORA_DO_CI, no topo deste workflow"; done
            echo ""
            echo "A soma é conferida mecanicamente por \`tests/unit/e2e-cobertura-completa.test.ts\`:"
            echo "spec no disco que não esteja em nenhuma das quatro listas reprova o build."
          } >> "$GITHUB_STEP_SUMMARY"
