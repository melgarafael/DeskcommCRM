name: ci

on:
  pull_request:
  push:
    branches: [main]

# O GITHUB_TOKEN destes jobs serve a `actions/checkout` (clone) e a
# `actions/setup-node` (manifest de `actions/node-versions`, repo público) —
# `contents: read` cobre os dois, que é o escopo que o próprio modelo de dados do
# CodeQL prescreve para essas duas actions. O `cache: pnpm` NÃO usa este token
# (usa ACTIONS_RUNTIME_TOKEN), `pnpm/action-setup` não tem input de token, e
# nenhum passo `run:` enxerga o token por padrão — ele só entra no ambiente via
# `secrets.GITHUB_TOKEN`. Os passos que o fazem, e por quê, estão ao lado de
# cada `GH_TOKEN:`; para contar em vez de acreditar nesta linha:
#   grep -n 'secrets.GITHUB_TOKEN' .github/workflows/ci.yml
# (Esta linha afirmava "não aparece em nenhum destes workflows" com dois usos já
# na main — achado 9 da revisão do #1268.)
#
# No topo, e não por job, porque os dois jobs precisam do mesmo escopo e job
# acrescentado depois nasce restrito em vez de herdar o default do repositório.
# Esse default hoje é `read` (medido em actions/permissions/workflow), então isto
# não corrige vazamento em vigor: tira a garantia de uma configuração que muda
# fora do repo, num clique, sem PR e sem deixar rastro aqui. `packages: write`
# continua por job em publish-image.yml — mesma regra, menor escopo que precisa.
permissions:
  contents: read

# ── Uma rodada por PR: o push novo cancela a antiga — POR JOB, nunca por workflow
#
# Medido em 18/09/2026, com a fila do Actions estrangulada: `ci/rebalancear-
# partes-do-e2e` tinha 8 runs ativos em 2 heads distintos. Cada push deixava a
# rodada anterior queimando runner até o fim, e o job do contribuidor esperava
# atrás da medição de um commit que já não existe.
#
# O `concurrency:` mora em cada job PESADO (verify, invariants-majors, e2e-parte,
# build-and-size, builds de imagem) e NUNCA no workflow nem nos agregadores
# (`invariants`, `e2e`, `imagens-ok`). A primeira versão (PR #1183) pôs no
# workflow, e o efeito medido foi o contrário do pretendido: o agregador roda com
# `if: always()` — e `always()` roda MESMO na rodada cancelada —, então ele ficou
# na fila esperando vaga e SEGURANDO O GRUPO. A rodada nova ficou `pending` por
# 53 min (#1190: nasceu 16:28Z, o agregador da rodada velha fechou 17:21Z). No
# nível de job, o agregador velho não pertence a grupo nenhum: roda em segundos,
# lê `cancelled` e reprova o head superado, sem bloquear ninguém.
#
# Por que NÃO `if: ${{ !cancelled() }}` nos agregadores, que também destrava:
# ele pula o agregador quando a rodada é cancelada, e `skipped` é check
# SATISFEITO para a branch protection. Um cancelamento manual da rodada do head
# ATUAL deixaria `invariants`/`e2e`/`imagens-ok` verdes sem ter medido nada.
#
#   pull_request   → cancela o job superado. Medição de head velho não vale nada.
#   push na main   → não cancela (a rodada da main é a medição da árvore
#                    integrada). Com grupo, um job PENDENTE da main é substituído
#                    pelo mais novo — que roda e mede um superconjunto.
#   tag            → nunca. É a publicação da versão.
#
# Exceção: publish-image também cancela no push da main (lá o produto é
# `latest`, que a rodada seguinte sobrescreve) — o porquê está no arquivo dele.
# O grupo é por PR (e não por branch) para reabrir um PR não colidir com o run
# de outro que aponte para a mesma ref. Vigiado por
# tests/unit/concorrencia-so-nos-jobs-pesados.test.ts.
#
# ── REENTRADA (aprovação, rerun) vai para o grupo DO SEU HEAD ────────────────
#
# O GitHub decide quem cancela quem pela ORDEM EM QUE O JOB ENTRA NA FILA, não
# pela idade do commit. A primeira tentativa de um run nasce do push, na ordem
# dos pushes, e aí "o último a entrar" é o head novo. A tentativa ≥ 2 não: ela
# é um run VELHO voltando — aprovação de `action_required` (PR de fork de quem
# contribui pela primeira vez; a aprovação vira a tentativa 2) ou rerun manual.
# Com o grupo só por PR, esse run velho entrava por último e cancelava o head
# ATUAL, que ficava só com `cancelled` e o agregador em `failure` — vermelho
# para sempre, com o merge automático ligado, sem nenhum run novo para salvá-lo.
#
# Medido em 22/09/2026: #1446 (head 096b49930, run 35746675409) e #1431 (head
# 1119e0ce8, run 35746393767). Os dois runs de cada PR estavam em
# `action_required` e foram aprovados. O do head NOVO começou primeiro (#1446:
# 15:21:04Z), o do head VELHO foi aprovado às 15:28:10Z, e o `verify-parte`
# do head novo foi cancelado dois segundos depois ("Canceling since a higher
# priority waiting request for ci-verify-parte1-1446 exists"). O run velho
# terminou verde, medindo um commit que já não era o do PR.
#
# Por isso, em `pull_request`, a tentativa ≥ 2 ganha o sufixo
# `-reentrada-<head>`: ela nunca cancela o head de outro commit, e reruns do
# MESMO head continuam dividindo um grupo só. O custo é o run velho aprovado
# rodar até o fim em paralelo, em vez de ser cancelado. A primeira tentativa
# segue no grupo do PR, e o push novo continua cancelando o velho.

jobs:
  # A suíte de unit em DUAS partes paralelas, e o check obrigatório `verify` é o
  # agregador lá embaixo — mesmo padrão do `invariants`.
  #
  # Medido em 18/09/2026: o `verify` inteiro levava 712 s de mediana nos verdes e
  # 13 de 40 rodadas morreram no teto de 15 min (`cancelled`, 915 s). No #1190,
  # com as cercas já separadas, ainda 866 s — 34 s de folga. O tempo NÃO é teste
  # lento: `tests` somava 229 s, `environment` (jsdom montado por arquivo) 910 s
  # e `import` 415 s (run do head d8af02fee). Custo por arquivo se divide por
  # arquivo: cada parte roda metade (`--shard`) e paga metade do jsdom.
  #
  # Os passos de arquivo inteiro rodam cada um numa parte só: cercas, typecheck
  # e as três auditorias na 1; lint e kit bash na 2 — é o que equilibra as duas.
  # O `--shard` corta por CONTAGEM de arquivos (554/554), não por tempo; quem
  # equilibra o relógio é onde moram estes passos. A divisão em partes é o
  # conserto estrutural da issue #1185, que o #1184 deixou anotado: com ele,
  # o teto volta de 25 para 15 (guarda de travamento) e o orçamento desce de 16
  # para 12 — quem denuncia a suíte crescendo é o orçamento, por parte.
  #
  # O lint morava na parte 1 até 22/09/2026. Medido nos 24 pares verdes daquele
  # dia: parte 1 mediana 10,0 min (máx 10,5), parte 2 8,1 (máx 8,7) — a 1
  # carregava 167 s de passos inteiros contra 42 s da 2, e crescia ~0,4 min/dia
  # (8,4 em 18/09). Mudar só o lint (63 s) dá 8,9 / 9,1 (máx 9,3 / 9,6); mudar
  # lint E typecheck só trocaria qual parte pesa (7,8 / 10,1). Isto ADIA, não
  # cura: a suíte soma ~46 s/dia às duas partes juntas. Quando uma parte chegar
  # a 11 min (2 de folga até o vermelho do orçamento, aos 13), o conserto é a
  # terceira parte (matrix + `--shard=N/3`) — reequilibrar de novo não sobra.
  verify-parte:
    # Guarda de travamento. O DETECTOR de crescimento é o passo `Orçamento de
    # tempo` no fim de cada parte; a medição que justifica o número está em
    # `TETOS`, em tests/unit/preambulo-do-ci-nao-come-o-relogio.test.ts.
    timeout-minutes: 15
    # Executor próprio para trabalho nosso quando EXECUTOR_PROPRIO=ligado; o
    # porquê e a guarda contra fork: comentário do e2e-parte no e2e.yml.
    runs-on: ${{ vars.EXECUTOR_PROPRIO == 'ligado' && (github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository) && 'deskcomm-proprio' || 'ubuntu-latest' }}
    concurrency:
      group: ${{ github.workflow }}-verify-parte${{ matrix.parte }}-${{ github.event.pull_request.number || github.ref }}${{ github.event_name == 'pull_request' && github.run_attempt != '1' && format('-reentrada-{0}', github.event.pull_request.head.sha) || '' }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    strategy:
      # Sem fail-fast: um vermelho numa parte não esconde o da outra.
      fail-fast: false
      matrix:
        parte: [1, 2]
    steps:
      - uses: actions/checkout@v7

      - name: Marcar o início (o orçamento de tempo mede no fim do job)
        run: echo "VERIFY_INICIO=$(date +%s)" >> "$GITHUB_ENV"

      # ── O VERDE DESTE PR É DE QUAL ÁRVORE? ────────────────────────────────
      #
      # Em `pull_request`, o CI mede a PRÉVIA do merge — base + head no instante
      # do evento — e essa prévia NÃO se atualiza sozinha quando a `main` anda.
      # Medido em 18/09/2026: três PRs "mergeable e verdes" tinham prévia
      # atrasada em 29, 52 e 35 commits; e o PR de release #1229 foi mesclado
      # contra uma base 5 commits velha, com um fragmento de `.changes/` que a
      # prévia não continha — a versão teria saído com um conserto dentro e sem
      # nota.
      #
      # Avisar só "atrasada em N commits" seria RUÍDO: a `main` recebeu ~40
      # merges neste único dia, então quase todo PR está atrasado e o aviso
      # perderia o sentido em uma semana. O aviso aqui é o CRUZAMENTO: a `main`
      # andou em arquivos que ESTE PR também toca. É o caso em que o verde
      # mediu uma árvore que não existe mais — e é exatamente a forma dos dois
      # defeitos de hoje (fragmento órfão e `modify/delete` em `.changes/`).
      #
      # Nunca reprova: um PR não pode ficar vermelho porque outra pessoa
      # mesclou algo enquanto ele esperava vaga na fila. Quem decide o rebase é
      # quem vai mesclar — este passo só tira a decisão do escuro.
      - name: A prévia deste PR mediu a main de agora?
        if: github.event_name == 'pull_request' && matrix.parte == 1
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BASE: ${{ github.event.pull_request.base.sha }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          set -uo pipefail
          # `base.sha` é a base da PRÓPRIA prévia que este run está medindo.
          comp=$(gh api "repos/${GITHUB_REPOSITORY}/compare/${BASE}...${GITHUB_BASE_REF:-main}" 2>/dev/null) || {
            echo "::warning::não consegui comparar a base da prévia com a ${GITHUB_BASE_REF:-main} — NÃO MEDIDO"; exit 0; }
          atraso=$(printf '%s' "$comp" | jq -r '.ahead_by // 0')
          printf '%s' "$comp" | jq -r '.files[]?.filename' | sort -u > /tmp/main-andou.txt
          gh api --paginate "repos/${GITHUB_REPOSITORY}/pulls/${PR}/files" --jq '.[].filename' 2>/dev/null | sort -u > /tmp/pr-toca.txt
          cruzamento=$(comm -12 /tmp/main-andou.txt /tmp/pr-toca.txt)
          n=$(printf '%s' "$cruzamento" | grep -c . || true)
          {
            echo "## A prévia deste PR"
            echo ""
            echo "| | |"
            echo "| --- | --- |"
            echo "| base medida por este run | \`${BASE:0:9}\` |"
            echo "| commits que a \`${GITHUB_BASE_REF:-main}\` andou desde então | ${atraso} |"
            echo "| desses, arquivos que este PR TAMBÉM toca | ${n} |"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "${n:-0}" -gt 0 ]; then
            echo "::warning title=O verde deste PR mediu uma árvore que já não existe::a ${GITHUB_BASE_REF:-main} andou ${atraso} commits desde a base desta prévia, e ${n} arquivo(s) do seu PR mudaram lá. Rebase/merge antes de mesclar — o verde atual não mediu o que seria mesclado."
            printf '%s\n' "$cruzamento" | head -10 | sed "s|^|::warning::também mudou na ${GITHUB_BASE_REF:-main}: |"
            {
              echo ""
              echo "Arquivos em comum (até 10):"
              echo ""
              printf '%s\n' "$cruzamento" | head -10 | sed "s|^|- \`|; s|$|\`|"
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "prévia com base ${BASE:0:9}; a ${GITHUB_BASE_REF:-main} andou ${atraso} commits, nenhum nos arquivos deste PR"
          fi
          # A lista de arquivos da comparação vem truncada acima de 300 arquivos
          # (limite da API): cruzamento vazio num intervalo enorme é NÃO MEDIDO,
          # não "não houve".
          if [ "$atraso" -gt 250 ]; then
            echo "::warning::a comparação pode ter vindo truncada (${atraso} commits) — cruzamento vazio aqui é NÃO MEDIDO"
          fi

      - uses: ./.github/actions/preparar-node
        # O teto do preâmbulo mora aqui porque passo de composite action não
        # aceita `timeout-minutes`. Razão e medições: o cabeçalho da action.
        timeout-minutes: 5

      # As guardas estruturais antes de tudo, no MESMO job (job novo disputaria
      # vaga numa fila que já é o gargalo). Elas só leem arquivo — baseline ×
      # cadeia, MANIFEST, varredura de anon, docs, workflows — e rodam sem jsdom
      # em segundos; dentro da suíte longa, o mesmo vermelho chegava aos 7–12
      # minutos. Rodam UMA vez: o passo de unit abaixo pula o projeto `cercas`.
      # Seleção e medições: o bloco `projects` de vitest.config.ts.
      - name: Cercas estruturais
        if: matrix.parte == 1
        run: pnpm cercas

      - name: Typecheck
        if: matrix.parte == 1
        run: pnpm typecheck

      # Na parte 2, não na 1: o porquê e a conta estão no cabeçalho do job.
      - name: Lint
        if: matrix.parte == 2
        run: pnpm lint

      # Invariante 1 de docs/doctrine/restricao-de-canal.md: nenhuma feature
      # nomeia um provider. Step próprio (e não só dentro de `gov:verify`)
      # porque é o CI que gateia PR — `gov:verify` não é invocado por nenhum
      # workflow, e mecanismo que não roda no gate não protege nada.
      - name: Channel provider leak
        if: matrix.parte == 1
        run: pnpm lint:channels

      # Auditoria de autorização e papel: impede comparações diretas de papel
      # fora de lib/auth/ que contornem o gate de MFA e requireRole().
      - name: Role rank audit
        if: matrix.parte == 1
        run: pnpm lint:role-rank

      # O merge LIMPO não chama hook nenhum: dois PRs com migrations de nomes
      # diferentes não conflitam textualmente, o commit nasce sem `pre-commit` e o
      # número duplicado entra calado (o #804 entrou assim com o `0241`; o `0161` foi
      # disputado por cinco PRs — issue #285). A régua por número era só hook local:
      # `core.hooksPath` é configuração local, NÃO versionada, que fork nenhum executa.
      # Step próprio, como os dois acima, porque é o CI que gateia PR — `gov:verify`
      # não é invocado por workflow nenhum. Mesma régua do hook do contribuidor,
      # contra o REMOTO (e o script busca a base: o checkout daqui não traz origin/main).
      - name: Colisão de número de migration
        if: matrix.parte == 1
        run: pnpm checar:colisao-de-migration

      # POR QUE NÃO HÁ UMA CAMADA "o número foi tomado depois da prévia": o
      # passo acima JÁ É ELA. O script busca a base no remoto no instante do job
      # (`git fetch +refs/heads/<base>`) e compara contra `git ls-tree` dela —
      # ou seja, contra a `main` de AGORA, não contra a base da prévia. Escrevi
      # uma camada 1b antes de enxergar isso; ela era redundante, e ainda por
      # cima CEGA: usava `gh api compare`, que devolve no máximo 300 arquivos em
      # ordem alfabética, e `supabase/migrations` cai fora do corte — medido, o
      # compare do #965 devolve 300 arquivos e ZERO migrations, com cinco
      # colisões reais. Achado do @Maestro PRs na revisão do #1268.
      #
      # O que sobra de verdade é o RUN envelhecer: o verify do #965 terminou em
      # 16/09 e segue verde. Isso não se conserta dentro do job — quem fecha é o
      # vigia periódico (.github/workflows/vigia-de-colisao.yml).

      # E A ÁRVORE INTEIRA, fora de pull_request — porque lá o passo acima é
      # INERTE: em push HEAD é a própria base, nada foi "acrescentado", e ele sai
      # OK sem medir duplicata nenhuma.
      #
      # É nessa fresta que a duplicata entra: o verde de um PR é uma foto do
      # passado. Medido em 19/09/2026, o #965 estava verde com prévia de 1039
      # commits atrás e CINCO números já tomados — a guarda dele rodou contra uma
      # `main` que já não existe. Se algo assim escapar (prévia velha, merge fora
      # do fluxo, administrador que ignora o check), a `main` reprova na hora, em
      # vez de a descoberta ser o `db push` de um self-hoster.
      #
      # Medido hoje na `main`: 263 migrations, zero duplicatas — nasce verde.
      # Vigiado por tests/unit/main-sem-migration-duplicada.test.ts.
      - name: A árvore da main tem NNNN ou timestamp repetido?
        if: matrix.parte == 1 && github.event_name != 'pull_request'
        run: |
          set -uo pipefail
          nomes="$(git ls-tree -r --name-only HEAD -- supabase/migrations | grep -E '\.sql$' | sed 's#.*/##')"
          total="$(grep -c . <<<"$nomes" || true)"
          # Controle de vivacidade: árvore sem migration nenhuma é sonda cega, não
          # "está tudo certo". Medido em 19/09/2026: 263 arquivos.
          if [ "${total:-0}" -lt 100 ]; then
            echo "::error title=A varredura de duplicata não mediu nada::li ${total:-0} migration(ões) em supabase/migrations — a sonda perdeu o caminho."
            exit 2
          fi
          dup_n="$(grep -oE '^[0-9]{14}_[0-9]{4}' <<<"$nomes" | cut -d_ -f2 | sort | uniq -d)"
          dup_t="$(grep -oE '^[0-9]{14}' <<<"$nomes" | sort | uniq -d)"
          if [ -n "$dup_n" ] || [ -n "$dup_t" ]; then
            for n in $dup_n; do
              echo "::error title=NNNN duplicado na árvore::${n} aparece em: $(grep -E "^[0-9]{14}_${n}_" <<<"$nomes" | tr '\n' ' ')"
            done
            for ts in $dup_t; do
              echo "::error title=Timestamp duplicado na árvore::${ts} aparece em: $(grep -E "^${ts}_" <<<"$nomes" | tr '\n' ' ')"
            done
            echo "Conserto: renumerar o arquivo que entrou por último (NNNN e TIMESTAMP juntos) num PR de forward-fix — migration já aplicada não se edita."
            exit 1
          fi
          echo "OK — ${total} migrations na árvore, nenhum NNNN nem timestamp repetido."

      # `--project produto` é o `pnpm test:unit` MENOS as cercas, que já
      # rodaram acima; `--shard` divide os arquivos entre as duas partes. Juntos
      # são a suíte inteira, uma vez só. Localmente o comando continua sendo
      # `pnpm test:unit`, sem recorte.
      - name: Unit tests (parte ${{ matrix.parte }}/2)
        run: pnpm test:unit --project produto --shard=${{ matrix.parte }}/2

      # O ACERVO DE `.changes/` CABE NA TELA DA VPS? — e por que fora de PR.
      #
      # A seção que os fragmentos acumulados vão produzir tem o mesmo teto em
      # bytes que qualquer outra (o `head -c` do agent.sh). O que muda é de quem
      # é a dívida: o acervo é coletivo, e o único remédio é CORTAR RELEASE.
      #
      # Isto rodava dentro do `pnpm test:unit`, portanto em `pull_request`, e em
      # 20/09/2026 reprovou o `verify` dos PRs #1377 (@lucasa15) e #1363 por
      # `A seção termina no byte 32686` com 43 fragmentos acumulados — nenhum
      # dos dois tocava `.changes/`. A mensagem mandava o contribuidor enxugar
      # fragmento de terceiro, e o vermelho sumiu sozinho quando a 1.41.0
      # consumiu os fragmentos. Quem responde pelo vermelho tem de poder
      # consertá-lo; aqui quem o vê é quem corta release.
      #
      # O passo também AVISA antes de estourar (`::warning::`), por uma régua
      # derivada do próprio acervo — "dobrar este acervo não caberia" —, nunca
      # por um número digitado. O teto já é lido do `agent.sh` pelo mesmo motivo.
      #
      # As duas metades da candidata que ficou no PR continuam em
      # `tests/unit/changelog-cabe-na-tela-da-vps.test.ts`; que esta não sumiu de
      # todo lugar é cobrado por `tests/unit/acervo-do-changelog-cobra-a-casa.test.ts`.
      #
      # DEPOIS dos unit tests, e não antes como as outras cercas: este passo é o
      # único do job projetado para ficar vermelho DE VEZ EM QUANDO na `main` —
      # é assim que ele pede o corte de release. Antes da suíte, cada vermelho
      # dele levaria junto metade dos unit tests da `main` (a parte 1 não
      # chegaria a rodar), e a dívida de changelog passaria a esconder defeito
      # de código. As cercas acima podem vir antes porque um vermelho nelas é
      # anomalia, não rotina.
      - name: O acervo de .changes/ cabe na tela da VPS?
        if: matrix.parte == 1 && github.event_name != 'pull_request'
        run: pnpm release:acervo-cabe


      # Scripts do kit self-host num repo git descartável (docker/crontab
      # dublados). É o único gate que exercita o update.sh — um erro aqui
      # rebobina a instalação de quem hospeda, e nenhum teste TS o veria.
      #
      # Desde 2026-08-08 inclui `hostgator-setup-kit/test-validators.sh`, os 163
      # casos que cobrem o install.sh. Eles existiam e NÃO rodavam em job nenhum
      # (issue #191): dois defeitos que tornavam a instalação impossível —
      # escolher OpenRouter travava o instalador num laço, escolher OpenAI
      # deixava o .env pela metade — passaram por todos os checks verdes. 15s.
      - name: Kit self-host (bash)
        if: matrix.parte == 2
        run: pnpm test:shell

      - name: Orçamento de tempo do verify-parte
        if: always()
        env:
          # Orçamento em MINUTOS, POR PARTE — o DETECTOR de crescimento da
          # suíte. O teto (`timeout-minutes: 15`, no topo do job) é outra coisa:
          # guarda de travamento.
          #
          # ── O 12 ERA DECLARADO; AGORA É MEDIDO ───────────────────────────
          #
          # Ele nasceu como estimativa ("~8,5 min da parte mais pesada... NÃO
          # MEDIDO até a primeira rodada das partes"). Medido em 19/09/2026,
          # sobre TODOS os jobs `verify-parte` das 240 rodadas completas de
          # ci.yml criadas depois de as partes entrarem na main (18/09 18:37Z):
          #
          #     n=286 jobs que EXECUTARAM (260 success + 26 failure)
          #     min 0,9 · mediana 7,2 · p90 8,6 · p95 8,8 · MÁX 9,6
          #     acima de 10 min: ZERO.  acima de 12: ZERO.  acima de 15: ZERO.
          #
          #     parte 1/2 (cercas+typecheck+lint): mediana 8,3 · máx 9,6
          #     parte 2/2 (kit bash):              mediana 7,0 · máx 7,5
          #
          # O 12 é máx+2,4, com 3 min até o teto — o detector dispara ANTES do
          # corte, que é a propriedade que faz chegar um `::error::` legível em
          # vez de um `cancelled` mudo. A estimativa acertou; agora ela tem
          # número atrás.
          #
          # ── OS 100 CANCELADOS, E POR QUE ELES NÃO CENSURAM ESTA CONTA ────
          #
          # Descartar `cancelled` em silêncio é o erro que este bloco existe
          # para não repetir, então: foram 100 no mesmo intervalo, e eu fui
          # olhar o que eles eram. 87 têm ZERO passos — nunca rodaram, morreram
          # esperando runner na fila; os 13 que executaram foram cortados no
          # meio por push novo (`cancel-in-progress`), o mais longo com 6,5 min.
          #
          # NENHUM morreu no teto. A ausência deles não corta a cauda alta da
          # distribuição (falta de runner não tem relação com a duração do
          # job), então os 286 acima são amostra não-censurada — ao contrário
          # do que aconteceu com o valor anterior deste campo.
          #
          # ⚠️ A LIÇÃO DE MÉTODO, que vale mais que o número: **teto e orçamento
          # CENSURAM a medição que os calibra.** O valor que este campo teve
          # antes (16, e depois 19) saiu de "pior sucesso 14,9" medido sob um
          # teto de 15 — e sob aquele teto o job que passaria de 15 morria e
          # entrava em `cancelled`, não em `success`. Era a distribuição dos
          # SOBREVIVENTES tratada como a distribuição dos jobs. Nunca derive um
          # destes dois números da distribuição medida sob o valor anterior:
          # a cauda que interessa é exatamente a que o valor anterior cortou.
          # Depois de mexer em qualquer um dos dois, ESPERE a distribuição nova,
          # classifique os `cancelled` e só então recalibre.
          #
          # A catraca que impede este número de subir sem razão escrita está em
          # tests/unit/preambulo-do-ci-nao-come-o-relogio.test.ts (`ORCAMENTOS`).
          ORCAMENTO_MIN: "12"
        run: |
          set -euo pipefail
          if [ -z "${VERIFY_INICIO:-}" ]; then
            echo "::warning::NÃO MEDIDO — o job não chegou a registrar o início."
            exit 0
          fi
          decorrido=$(( ($(date +%s) - VERIFY_INICIO) / 60 ))
          echo "verify parte ${{ matrix.parte }}/2: ${decorrido} min (orçamento ${ORCAMENTO_MIN} min, teto de travamento 15 min)"
          if [ "$decorrido" -le "${ORCAMENTO_MIN}" ]; then
            exit 0
          fi
          echo "::error::A parte ${{ matrix.parte }}/2 do verify levou ${decorrido} min contra um orçamento de ${ORCAMENTO_MIN} min."
          echo "::error::Isto NÃO é defeito do seu PR: a suíte unitária cresceu. Em 18/09/2026, \`Unit tests\` já era 10,3 dos 13,2 min do job."
          echo "::error::O conserto é mais uma parte em \`verify-parte\` (matrix + --shard), não subir este número."
          exit 1

  # O NOME DESTE JOB É O CHECK OBRIGATÓRIO `verify` — o agregado das partes,
  # mesmo padrão do `invariants` abaixo (a razão do nome está lá). Sem grupo de
  # concurrency, de propósito: ver o cabeçalho deste arquivo.
  verify:
    if: always()
    needs: [verify-parte]
    runs-on: ubuntu-latest
    # Nenhuma permissão: este job só lê o resultado de `needs`.
    permissions: {}
    steps:
      - name: Falhar se qualquer parte não passou
        run: |
          echo "verify-parte: ${{ needs.verify-parte.result }}"
          # `success` só com AS DUAS partes verdes; `skipped` e `cancelled`
          # reprovam — parte que não rodou não mediu nada.
          [ "${{ needs.verify-parte.result }}" = "success" ]

  # Gate de isolamento multi-tenant + invariantes de governança.
  # Job separado de propósito: roda em paralelo ao verify (não atrasa o feedback
  # rápido) e vira um check nomeado, que é o que a doutrina de RLS exige provar.
  # Cada perna sobe `pgvector/pgvector` na SUA major, aplica supabase/baseline.sql
  # em modo install (ON_ERROR_STOP=1) e update (idempotência), e roda
  # tests/invariants/** contra ele. Invocar via `pnpm test:db` é o que põe
  # node_modules/.bin no PATH que o script herda para chamar `vitest`.
  #
  # AS DUAS MAJORS, e por que as duas (issue #454): pg15 é o PISO que dizemos
  # suportar — o piso real do `baseline.sql`, `security_invoker` em view — e é
  # onde quem digita `pnpm test:db` na própria máquina cai por padrão; pg17 é a
  # major de onde o `pg_dump` do baseline saiu e o que o Supabase entrega a
  # projeto novo. Rodar só no piso mediu uma instalação que não era a do dump;
  # rodar só na de cima era o estado até a #422. A major entra por
  # `TEST_DB_IMAGE`, a MESMA variável dos dois scripts, e o PADRÃO dela continua
  # sendo o piso (`scripts/test-db.sh`) — quem guarda isso é
  # tests/unit/baseline-no-piso-do-postgres.test.ts.
  # QUAL MATRIZ DE MAJOR? A de cima sempre; a de PISO só quando o PR a alcança.
  #
  # `invariants-majors` roda o `test:db` inteiro uma vez por major. Medido de 15 a
  # 18/09/2026: 1.658 min de runner por dia nas duas pernas, e 72% dos PRs não
  # tocam schema, script de banco, kit nem invariante — nesses, a perna do piso
  # mede a mesma coisa que a de cima, com outra versão de Postgres, sem chance de
  # reprovar por razão de major. A regra e o porquê de cada caminho estão no
  # cabeçalho de scripts/pr-mexe-no-piso-do-postgres.sh.
  #
  # O que a major de CIMA continua pegando em todo PR: RLS, governança e o
  # vocabulário banco × TypeScript — nada disso depende da versão do Postgres.
  # O piso existe por outra razão (issue #454): provar que o `baseline.sql` sobe
  # na MENOR major que dizemos suportar.
  #
  # Fora de pull_request (push na `main`, tag, dispatch) a pergunta não é feita:
  # as duas majors rodam sempre. Então toda mudança de schema é medida no piso no
  # PR dela E de novo na árvore integrada — e o agregador EXIGE isso fora de PR.
  #
  # Roda nas máquinas do GitHub sempre: é de segundos e decide a matriz.
  invariants-alcance:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      majors: ${{ steps.alcance.outputs.majors }}
      piso: ${{ steps.alcance.outputs.piso }}
    steps:
      - uses: actions/checkout@v7
        if: github.event_name == 'pull_request'
        with:
          sparse-checkout: scripts/pr-mexe-no-piso-do-postgres.sh
          sparse-checkout-cone-mode: false

      - name: O PR alcança o piso do Postgres?
        id: alcance
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          set -uo pipefail
          responde() {
            echo "piso=$1" >> "$GITHUB_OUTPUT"
            if [ "$1" = sim ]; then echo 'majors=["15","17"]' >> "$GITHUB_OUTPUT"
            else echo 'majors=["17"]' >> "$GITHUB_OUTPUT"; fi
            echo "piso=$1 ($2)"
          }
          if [ "${GITHUB_EVENT_NAME}" != "pull_request" ]; then
            responde sim "evento ${GITHUB_EVENT_NAME}"; exit 0
          fi
          if ! arquivos=$(gh api --paginate "repos/${GITHUB_REPOSITORY}/pulls/${PR}/files" --jq '.[].filename'); then
            echo "::warning::não consegui listar os arquivos do PR — roda as duas majors"
            responde sim "lista indisponível"; exit 0
          fi
          n=$(printf '%s\n' "$arquivos" | grep -c . || true)
          if [ "$n" -ge 3000 ]; then
            responde sim "lista cortada em ${n}"; exit 0
          fi
          resposta=$(printf '%s\n' "$arquivos" | bash scripts/pr-mexe-no-piso-do-postgres.sh) || resposta=sim
          [ "$resposta" = "nao" ] || resposta=sim
          responde "$resposta" "${n} arquivo(s) no PR"

  invariants-majors:
    # Eram 20 min quando a perna tinha UMA passada; agora ela tem duas
    # (`test:db` + `test:db:update`) e o teto acompanha. O 30 é DECLARADO, não
    # medido — não há Docker onde esta matriz foi escrita —, e existe para o
    # vermelho continuar falando de schema: mantido em 20, a perna morreria por
    # relógio no meio da segunda passada.
    timeout-minutes: 30
    # Executor próprio para trabalho nosso quando EXECUTOR_PROPRIO=ligado; o
    # porquê e a guarda contra fork: comentário do e2e-parte no e2e.yml.
    runs-on: ${{ vars.EXECUTOR_PROPRIO == 'ligado' && (github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository) && 'deskcomm-proprio' || 'ubuntu-latest' }}
    needs: [invariants-alcance]
    concurrency:
      group: ${{ github.workflow }}-invariants-majors-pg${{ matrix.pg }}-${{ github.event.pull_request.number || github.ref }}${{ github.event_name == 'pull_request' && github.run_attempt != '1' && format('-reentrada-{0}', github.event.pull_request.head.sha) || '' }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    strategy:
      # `false` e não o padrão (`true`): com `fail-fast`, a primeira major que
      # reprovasse CANCELARIA a outra e o relatório diria "cancelled" em vez de
      # medir as duas. Cobertura declarada que o CI cancela é o modo de falha
      # que esta issue existe para fechar.
      fail-fast: false
      matrix:
        # A lista vem do `invariants-alcance`: ["15","17"] sempre que o PR
        # alcança o piso, e fora de pull_request; ["17"] no PR que não alcança.
        pg: ${{ fromJSON(needs.invariants-alcance.outputs.majors) }}
    env:
      # Uma variável, os dois scripts: `scripts/test-db.sh` e
      # `scripts/test-update-com-dados.sh` leem esta para escolher a imagem.
      TEST_DB_IMAGE: pgvector/pgvector:pg${{ matrix.pg }}
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/preparar-node
        # O teto do preâmbulo mora aqui porque passo de composite action não
        # aceita `timeout-minutes`. Razão e medições: o cabeçalho da action.
        timeout-minutes: 5

      - name: RLS isolation + governance invariants (pg${{ matrix.pg }})
        run: pnpm test:db

      # O `update.sh` do cliente roda sobre um banco COM DADOS, e nenhum gate
      # exercitava isso: `test:db` aplica o baseline num banco VAZIO, então
      # constraint que só quebra com linha existente passava verde (é o achado
      # que o cabeçalho de scripts/test-update-com-dados.sh mede). O script
      # existia desde 2026-08-27 e NENHUM workflow o chamava (issue #454): aqui
      # ele passa a ser gate, nas duas majors, pela mesma variável de imagem.
      - name: update.sh sobre banco COM DADOS (pg${{ matrix.pg }})
        run: pnpm test:db:update

  # O NOME DESTE JOB É O CHECK OBRIGATÓRIO, e é por isso que ele existe — mesmo
  # padrão do `e2e` em e2e.yml e do `imagens-ok` em publish-image.yml.
  #
  # A branch protection da `main` exige um check chamado exatamente `invariants`
  # (a lista dos cinco — `verify, build-and-size, invariants, e2e, imagens-ok` —
  # está na triagem do CI; token de fork não lê branch protection pela API, e por
  # isso ela é citada, não remedida aqui). Job de matrix se
  # chama `invariants-majors (15)` e `invariants-majors (17)`: se a matriz
  # tivesse ficado com o nome `invariants`, a proteção passaria a esperar para
  # sempre um check que nenhum run produz, e NENHUM PR mergearia.
  invariants:
    if: always()
    needs: [invariants-alcance, invariants-majors]
    runs-on: ubuntu-latest
    # Nenhuma permissão: este job só lê o resultado de `needs`.
    permissions: {}
    steps:
      - name: Falhar se qualquer major não passou
        env:
          EVENTO: ${{ github.event_name }}
          PORTAO: ${{ needs.invariants-alcance.result }}
          PISO: ${{ needs.invariants-alcance.outputs.piso }}
          MAJORS: ${{ needs.invariants-majors.result }}
        run: |
          set -euo pipefail
          echo "evento=${EVENTO} invariants-alcance=${PORTAO} piso=${PISO:-<vazio>}"
          echo "invariants-majors: ${MAJORS}"
          # A pergunta tem de ter sido RESPONDIDA: portão que falhou deixa a
          # matriz `skipped`, e isso não pode ler como aprovação.
          [ "$PORTAO" = "success" ]
          # Fora de pull_request o piso é OBRIGATÓRIO: a `main` mede as duas.
          if [ "$EVENTO" != "pull_request" ]; then
            [ "$PISO" = "sim" ]
          fi
          # `success` é o único desfecho aceito: o agregado de uma matrix só é
          # `success` com TODAS as pernas verdes, então uma major sozinha
          # reprovando derruba o check obrigatório. `skipped` também reprova, de
          # propósito — perna pulada não mediu nada.
          [ "$MAJORS" = "success" ]
