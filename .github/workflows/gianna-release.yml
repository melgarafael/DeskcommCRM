name: Publicar versão do Gianna

on:
  push:
    tags: ["gianna-release-v*"]

permissions: {}

concurrency:
  group: gianna-release
  cancel-in-progress: false

jobs:
  version:
    if: github.repository == 'jadsonlsouza/DeskcommCRM'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      number: ${{ steps.version.outputs.number }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Conferir versão e origem
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#gianna-release-v}"
          [[ "$version" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          branch="$(git ls-remote --exit-code origin refs/heads/codex/amigo-api | cut -f1)"
          [[ "$branch" == "$GITHUB_SHA" ]] || {
            echo "::error::Crie a tag de publicação no topo da branch codex/amigo-api."
            exit 1
          }
          existing="$(git ls-remote --tags origin "refs/tags/v${version}")"
          if [[ -n "$existing" ]]; then
            echo "::error::A tag v${version} já existe. Use um novo número de versão."
            exit 1
          fi
          latest="$(gh release list --repo "$GITHUB_REPOSITORY" --exclude-drafts --exclude-pre-releases \
            --limit 100 --json tagName,isLatest --jq '.[] | select(.isLatest) | .tagName')"
          if [[ -n "$latest" && "$(printf '%s\n' "$latest" "v${version}" | sort -V | tail -1)" != "v${version}" ]]; then
            echo "::error::A versão nova precisa ser maior que $latest."
            exit 1
          fi
          if ! grep -Fqx "## [${version}]" CHANGELOG.gianna.md; then
            echo "::error::Adicione as notas da versão ${version} ao CHANGELOG.gianna.md."
            exit 1
          fi
          bash tests/shell/release-publicada-nao-maior-tag.test.sh
          bash tests/shell/single-server-installer.test.sh
          bash tests/shell/update-guard.test.sh
          echo "number=${version}" >> "$GITHUB_OUTPUT"

  images:
    needs: version
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        image: [deskcommcrm, deskcomm-worker, deskcomm-scheduler, deskcomm-voice-agent]
        arch: [amd64, arm64]
        include:
          - image: deskcommcrm
            dockerfile: Dockerfile
          - image: deskcomm-worker
            dockerfile: Dockerfile.worker
          - image: deskcomm-scheduler
            dockerfile: Dockerfile.scheduler
          - image: deskcomm-voice-agent
            dockerfile: Dockerfile.voice-agent
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/${{ matrix.arch }}
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}:gianna-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.arch }}
          build-args: APP_VERSION=${{ needs.version.outputs.number }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ needs.version.outputs.number }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=gianna-${{ matrix.image }}-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=gianna-${{ matrix.image }}-${{ matrix.arch }}

  release:
    needs: [version, images]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ needs.version.outputs.number }}
      CANDIDATE: gianna-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Disponibilizar as quatro imagens da mesma revisão
        run: |
          set -euo pipefail
          for image in deskcommcrm deskcomm-worker deskcomm-scheduler deskcomm-voice-agent; do
            ref="ghcr.io/${GITHUB_REPOSITORY_OWNER}/${image}"
            docker buildx imagetools create --tag "${ref}:${VERSION}" \
              "${ref}:${CANDIDATE}-amd64" "${ref}:${CANDIDATE}-arm64"
          done
          docker logout ghcr.io
          for image in deskcommcrm deskcomm-worker deskcomm-scheduler deskcomm-voice-agent; do
            ref="ghcr.io/${GITHUB_REPOSITORY_OWNER}/${image}:${VERSION}"
            if ! docker buildx imagetools inspect --raw "$ref" | jq -e '
              [.manifests[].platform | select(.os == "linux") | .architecture]
              | contains(["amd64", "arm64"])' >/dev/null; then
              echo "::error::${ref} não está acessível anonimamente nas duas arquiteturas. Na primeira publicação, torne o pacote público no GHCR e execute novamente todos os jobs."
              exit 1
            fi
          done
      - name: Publicar a atualização no fork
        run: |
          set -euo pipefail
          awk -v version="## [${VERSION}]" '
            $0 == version { printing = 1; next }
            /^## \[/ { if (printing) exit }
            printing { print }
          ' CHANGELOG.gianna.md > "$RUNNER_TEMP/gianna-release.md"
          gh release create "v${VERSION}" --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" --latest --title "Gianna ${VERSION}" \
            --notes-file "$RUNNER_TEMP/gianna-release.md"

  deploy:
    needs: [version, release]
    runs-on: ubuntu-latest
    permissions: {}
    env:
      VERSION: ${{ needs.version.outputs.number }}
      SHA: ${{ github.sha }}
    steps:
      - name: Atualizar a VPS
        env:
          SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh -i ~/.ssh/deploy_key -p "$VPS_PORT" -o StrictHostKeyChecking=accept-new \
            -o ServerAliveInterval=15 "root@$VPS_HOST" \
            "VERSION='$VERSION' SHA='$SHA' bash -s" <<'REMOTE'
          set -euo pipefail
          cd /opt/gianna
          git fetch --tags origin
          git checkout --detach "$SHA"
          cp .env ".env.bak-pre-$VERSION"
          sed -i -E \
            -e "s|^(APP_IMAGE=ghcr.io/[^:]+/deskcommcrm):.*|\1:$VERSION|" \
            -e "s|^(WORKER_IMAGE=ghcr.io/[^:]+/deskcomm-worker):.*|\1:$VERSION|" \
            -e "s|^(SCHEDULER_IMAGE=ghcr.io/[^:]+/deskcomm-scheduler):.*|\1:$VERSION|" \
            -e "s|^(VOICE_AGENT_IMAGE=ghcr.io/[^:]+/deskcomm-voice-agent):.*|\1:$VERSION|" \
            .env
          COMPOSE="docker compose -f docker-compose.prod.yml -f docker-compose.supabase-rede.yml -f docker-compose.tunel.yml"
          $COMPOSE pull
          $COMPOSE up -d
          docker image prune -f >/dev/null
          REMOTE
