name: Deploy imediato na VPS (fork)

# Dispara sozinho depois que "Publicar imagem Docker (GHCR)" termina com
# sucesso num push na main deste fork. Puxa a imagem :latest recém-publicada
# e reinicia os serviços. NÃO espera o Rafael mergear nada — é o deploy da
# SUA produção, a partir do SEU fork.
#
# Pré-requisito: a VPS precisa ter APP_IMAGE/WORKER_IMAGE/SCHEDULER_IMAGE no
# .env de produção apontando para ghcr.io/<seu-usuário>/... em vez do
# :stable do Rafael (docker-compose.prod.yml cai nesse default se a
# variável não existir).

on:
  workflow_run:
    workflows: ["Publicar imagem Docker (GHCR)"]
    types: [completed]
    branches: [main]
  workflow_dispatch: {}

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Pull e restart via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_SSH_HOST }}
          username: ${{ secrets.VPS_SSH_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          envs: DEPLOY_PATH
          script: |
            set -e
            cd "$DEPLOY_PATH"

            # O checkout do repositório na VPS acompanha a imagem. Ele não é
            # enfeite: `supabase/baseline.sql` mora nele, e é dele que sai o
            # schema quando alguém atualiza o banco. Sem este passo o
            # repositório congelava na data da instalação enquanto a imagem
            # andava — medido em 05/09/2026, com o checkout em v1.12.0 e o app
            # três versões à frente.
            #
            # A falha aqui NÃO cancela o deploy: uma árvore suja não é motivo
            # para a correção não subir. Mas o job termina vermelho no fim,
            # porque repositório atrasado em silêncio é como este problema
            # nasceu.
            CHECKOUT_FALHOU=0
            git fetch origin main && git checkout --detach origin/main || CHECKOUT_FALHOU=1
            if [ "$CHECKOUT_FALHOU" = "1" ]; then
              echo "::error::não consegui atualizar o checkout da VPS (árvore suja?). A imagem sobe assim mesmo; o repositório fica atrás — rode 'git status' lá."
            fi

            docker compose -f docker-compose.prod.yml -f docker-compose.traefik.yml --env-file .env pull app worker scheduler
            docker compose -f docker-compose.prod.yml -f docker-compose.traefik.yml --env-file .env up -d app worker scheduler
            docker image prune -f

            exit "$CHECKOUT_FALHOU"
        env:
          DEPLOY_PATH: ${{ secrets.VPS_DEPLOY_PATH }}
