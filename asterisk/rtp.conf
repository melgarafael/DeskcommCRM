; asterisk/rtp.conf
; Sem isto o Asterisk usa o default de fábrica (10000-20000) — a faixa
; publicada no docker-compose.voip.yml é só 10000-10200/udp. Testado ao vivo
; via tcpdump: nosso SDP ofereceu porta 19406, fora do range publicado, então
; nenhum pacote de RTP vindo de fora chegava no container (call conectava,
; ninguém ouvia nada). Precisa bater exatamente com o range do compose.
[general]
rtpstart=10000
rtpend=10200
