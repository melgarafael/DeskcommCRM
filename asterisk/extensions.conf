; asterisk/extensions.conf
;
; TODA mídia (entrada e saída) vai por AudioSocket (TCP puro,
; workers/voice-agent/audioSocketBridge.ts) — NUNCA por bridge ARI +
; externalMedia. Motivo: testado ao vivo (28/08) que uma bridge de mixing
; nunca relay áudio injetado por um canal externalMedia de volta pro outro
; membro, só manda silêncio pro trunk — limitação conhecida do
; chan_rtp/externalMedia do Asterisk pra esse padrão de uso, não bug nosso.
;
; ENTRADA: passa pela Stasis só de leve — o worker resolve org/agente pelo
; número discado, cria a linha em crm_calls, seta AUDIOSOCKET_UUID e devolve
; o canal pro dialplan (ARI `channel continue`) direto pro
; [from-trunk-audiosocket] abaixo. NUNCA cria bridge nem externalMedia.
;
; SAÍDA (originate via ARI, ver lib/voip/ariClient.ts): nem passa pela
; Stasis — origina direto no [voice-agent-out], já com AUDIOSOCKET_UUID
; setado (channelId escolhido em route.ts).

[from-trunk]
exten => _X.,1,NoOp(Chamada de entrada: ${CALLERID(num)} -> ${EXTEN})
 same => n,Stasis(voice-agent,inbound)
 same => n,Hangup()

[from-trunk-audiosocket]
exten => s,1,NoOp(Chamada de entrada IA via AudioSocket: ${AUDIOSOCKET_UUID})
 same => n,Answer()
 same => n,AudioSocket(${AUDIOSOCKET_UUID},voice-agent:9092)
 same => n,Hangup()

[voice-agent-out]
exten => s,1,NoOp(Chamada de saída IA via AudioSocket: ${AUDIOSOCKET_UUID})
 same => n,Answer()
 same => n,AudioSocket(${AUDIOSOCKET_UUID},voice-agent:9092)
 same => n,Hangup()
