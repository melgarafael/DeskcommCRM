<!--
  MODELO — os `__PLACEHOLDER__` são substituídos por self-host-kit/marca-emails.sh,
  que lê APP_NAME e APP_ACCENT_HEX do .env da instalação e sobe o resultado pela
  Management API do Supabase (PATCH /v1/projects/{ref}/config/auth).

  Quem roda GoTrue self-hosted (GOTRUE_MAILER_TEMPLATES_CONFIRMATION) NÃO pode
  apontar para ESTE arquivo: ele carrega placeholder. Renderize primeiro —
  `bash self-host-kit/marca-emails.sh --render-em /caminho/` — e aponte
  para o arquivo gerado.

  As cores do botão vêm em PAR (`background: <fallback>; background: __ACCENT__;`)
  de propósito: declaração com valor inválido é DESCARTADA pelo CSS, então o
  arquivo cru — o que o Supabase local usa em dev e no CI — renderiza com o
  accent do produto em vez de um botão transparente. É a única forma de o
  modelo ser legível antes de ser substituído.

  `&`, nunca `?`: ver o comentário equivalente em recovery.html. `.RedirectTo`
  já chega com `?type=signup` embutido (app/actions/auth/signUp.ts).
-->
<html>
  <body style="font-family: sans-serif; color: #1c1a16; background: #faf9f6; max-width: 480px; margin: 0 auto; padding: 24px;">
    <h2 style="font-size: 18px;">Confirme seu e-mail</h2>
    <p>Sua conta no __APP_NAME__ está quase pronta. Clique no botão abaixo para confirmar seu e-mail e ativar sua conta:</p>
    <p style="margin: 24px 0;">
      <a
        href="{{ .RedirectTo }}&token_hash={{ .TokenHash }}"
        style="background: #008069; background: __ACCENT__; color: #ffffff; color: __ACCENT_FG__; padding: 10px 20px; border-radius: 6px; text-decoration: none; display: inline-block;"
        >Confirmar e-mail</a
      >
    </p>
    <p style="font-size: 12px; color: #7d786c;">Se você não criou esta conta, ignore este e-mail.</p>
  </body>
</html>
