# Supabase CLI config — DeskcommCRM
# Docs: https://supabase.com/docs/guides/cli/config
# Este arquivo é versionado. Segredos vivem em .env.local (dev) ou no .env da instalação.

project_id = "deskcomm-crm"

[api]
enabled = true
port = 54321
schemas = ["public", "storage", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320

# pg15 = o PISO que prometemos suportar, e é o servidor que o contribuidor pega
# ao rodar `supabase start` — o mesmo que o job `invariants` do CI mede por
# padrão (`scripts/test-db.sh`, via `TEST_DB_IMAGE`). Ficou em 17 por um tempo,
# empurrado pelos 9 `GRANT … MAINTAIN` que o `pg_dump` do baseline emitiu
# sozinho; a #422 tirou os tokens e o piso voltou. Quem guarda esta linha é
# tests/unit/baseline-no-piso-do-postgres.test.ts.
#
# O e2e (e este arquivo) FICAM no piso de propósito (issue #454): é o job mais
# caro do CI, e rodá-lo nas duas majors dobraria o custo do que a matriz do
# `invariants` já cobre em pg15 E pg17. A major dói no DDL do `baseline.sql`,
# que é o que aquela matriz mede duas vezes.
major_version = 15

[db.pooler]
enabled = false
port = 54329
pool_mode = "transaction"
default_pool_size = 20
max_client_conn = 100

[realtime]
enabled = true

[studio]
enabled = true
port = 54323
api_url = "http://127.0.0.1:54321"

[inbucket]
enabled = true
port = 54324

[storage]
enabled = true
file_size_limit = "50MiB"

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = [
  "http://localhost:3000/auth/callback",
  "http://localhost:3000/auth/confirm",
  "http://localhost:3001/auth/confirm",
]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true # Signup self-service (/signup) — provisiona tenant em /auth/confirm

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = true

# Templates apontam para /auth/confirm (fluxo token_hash do @supabase/ssr).
# Self-host GoTrue: ver docs/deploy-selfhost (GOTRUE_MAILER_TEMPLATES_*).
[auth.email.template.confirmation]
subject = "Confirme seu e-mail — DeskcommCRM"
content_path = "./supabase/templates/confirmation.html"

[auth.email.template.recovery]
subject = "Redefinir senha — DeskcommCRM"
content_path = "./supabase/templates/recovery.html"

[auth.mfa]
max_enrolled_factors = 10

[auth.mfa.totp]
enroll_enabled = true
verify_enabled = true

[edge_runtime]
enabled = false # Não usamos Edge Functions no MVP
policy = "oneshot"

[analytics]
enabled = false
